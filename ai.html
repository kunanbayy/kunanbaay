<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI кеңесші — Shyraq Education</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root{ --navy:#1E3A5F; --navy2:#2D5491; --gold:#F2B84B; --bg:#F5F8FC; --border:#E8EEF6; --text:#1E293B; --muted:#7A8AA0; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
    a{text-decoration:none;color:inherit}
    .top{background:#fff;border-bottom:1px solid var(--border)}
    .top-in{max-width:860px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--navy)}
    .brand .mk{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#7C3AED,#60A5FA);display:grid;place-items:center;font-size:1.1rem}
    .brand .tag{font-size:.66rem;font-weight:800;color:var(--gold);letter-spacing:.1em;display:block}
    .back{padding:9px 15px;border-radius:11px;border:1px solid var(--border);background:#fff;color:var(--navy);font-weight:600;font-size:.86rem}
    .back:hover{background:#F1F5F9}
    .chat{flex:1;overflow-y:auto;padding:24px 20px}
    .chat-in{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
    .msg{display:flex;gap:10px;max-width:80%}
    .msg .av{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:1rem}
    .msg .bub{padding:13px 16px;border-radius:16px;font-size:.94rem;line-height:1.6}
    .msg.ai .av{background:linear-gradient(135deg,#7C3AED,#60A5FA);color:#fff}
    .msg.ai .bub{background:#fff;border:1px solid var(--border);border-top-left-radius:4px;box-shadow:0 4px 14px rgba(30,58,95,.05)}
    .msg.me{align-self:flex-end;flex-direction:row-reverse}
    .msg.me .av{background:var(--navy);color:#fff}
    .msg.me .bub{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-top-right-radius:4px}
    .msg .bub b{font-weight:700}
    .chips{max-width:860px;margin:0 auto;padding:0 20px 10px;display:flex;gap:8px;flex-wrap:wrap}
    .chip{padding:9px 14px;border-radius:999px;border:1px solid var(--border);background:#fff;color:var(--navy);font-size:.84rem;font-weight:600;cursor:pointer;transition:.15s}
    .chip:hover{background:#EEF4FB;border-color:#CADBF0}
    .composer{background:#fff;border-top:1px solid var(--border);padding:14px 20px}
    .composer-in{max-width:860px;margin:0 auto;display:flex;gap:10px}
    .composer input{flex:1;padding:14px 16px;border:1px solid var(--border);border-radius:14px;font-family:inherit;font-size:.95rem;outline:none}
    .composer input:focus{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(45,84,145,.12)}
    .send{width:50px;border:none;border-radius:14px;background:linear-gradient(135deg,#7C3AED,#60A5FA);color:#fff;font-size:1.1rem;cursor:pointer}
    .send:hover{filter:brightness(1.07)}
    .typing .bub{color:var(--muted);font-style:italic}
  </style>
</head>
<body>
  <div class="top"><div class="top-in">
    <div class="brand"><span class="mk">🤖</span><div>AI кеңесші<span class="tag">SHYRAQ AI</span></div></div>
    <a href="dashboard.html" class="back">← Кабинет</a>
  </div></div>

  <div class="chat" id="chat"><div class="chat-in" id="chatIn"></div></div>

  <div class="chips" id="chips"></div>

  <div class="composer"><div class="composer-in">
    <input id="inp" type="text" placeholder="Сұрағыңды жаз... (мысалы: маған қай мамандық сәйкес?)" onkeydown="if(event.key==='Enter')sendMsg()" />
    <button class="send" onclick="sendMsg()">➤</button>
  </div></div>

  <script>
    const chatIn=document.getElementById('chatIn');
    function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
    function add(role,html){
      const m=document.createElement('div'); m.className='msg '+role;
      m.innerHTML='<div class="av">'+(role==='ai'?'🤖':'🙂')+'</div><div class="bub">'+html+'</div>';
      chatIn.appendChild(m); document.getElementById('chat').scrollTop=1e9; return m;
    }
    function user(){ try{return JSON.parse(localStorage.getItem('shyraq_user'))||{}}catch(e){return{}} }
    function results(){ try{return JSON.parse(localStorage.getItem('shyraq_results'))}catch(e){return null} }

    function reply(q){
      q=q.toLowerCase();
      const r=results();
      if(/маманд|кім бол|сала|бағыт|қай оқу/.test(q)){
        if(r&&r.direction) return '<b>'+esc(r.direction)+'</b> бағыты саған жақын. ТОП мамандық: <b>'+esc(r.topSpec||'—')+'</b>. <a href="results.html" style="color:#7C3AED;font-weight:700">Толық нәтижені ашу →</a>';
        return 'Алдымен <a href="test.html" style="color:#7C3AED;font-weight:700">мамандық тестінен</a> өт — сонда қабілетіңе сай нақты бағыт ұсынамын. Ол небәрі 10 минут.';
      }
      if(/грант|балл|шек|өту|түсе/.test(q))
        return 'Грант мүмкіндігіңді нақты есептеу үшін болжам балыңды енгіз: <a href="grant.html" style="color:#7C3AED;font-weight:700">Грант калькулятор →</a>. Мен өткен жылғы нақты шекті балдармен салыстырамын.';
      if(/универ|жоо|оқу орны|қай жер/.test(q))
        return '99+ университет базасы бар. Қаласы, мамандығы немесе грант саны бойынша сүзіп көр: <a href="universities.html" style="color:#7C3AED;font-weight:700">Университеттер →</a>';
      if(/пән|ұбт|комбинац|таңда/.test(q))
        return 'ҰБТ-да 3 міндетті пән (Қазақстан тарихы, Оқу сауаттылығы, Мат. сауаттылық) + 2 бейіндік пән. Бейіндік жұпты кабинеттегі «Таңдаған пәндерім» бөлімінен таңда.';
      if(/сәлем|салам|привет|қалай/.test(q))
        return 'Сәлем, '+esc(user().name||'оқушы')+'! 👋 Мен Shyraq AI кеңесшісімін. Мамандық, грант, университет немесе ҰБТ пәндері туралы сұра.';
      if(/рахмет|рақмет|спасибо/.test(q)) return 'Оқуыңа сәттілік тілеймін! 🎓 Тағы сұрағың болса — жаз.';
      return 'Жақсы сұрақ! Мен мамандық таңдау, грант есептеу, университет іздеу және ҰБТ пәндері бойынша көмектесемін. Төмендегі ұсыныстардың бірін таңдап көр 👇';
    }
    function sendMsg(text){
      const inp=document.getElementById('inp');
      const q=(text||inp.value).trim(); if(!q) return;
      add('me',esc(q)); inp.value='';
      const t=add('ai','...'); t.classList.add('typing');
      setTimeout(()=>{ t.remove(); add('ai',reply(q)); }, 600);
    }
    const SUG=['Маған қай мамандық сәйкес?','Грантқа мүмкіндігім қандай?','Қай университетке түсейін?','ҰБТ пәндерін қалай таңдаймын?'];
    document.getElementById('chips').innerHTML=SUG.map(s=>'<button class="chip" onclick="sendMsg(\''+s.replace(/'/g,"\\'")+'\')">'+s+'</button>').join('');

    add('ai','Сәлем, <b>'+esc(user().name||'оқушы')+'</b>! 👋 Мен <b>Shyraq AI кеңесшісімін</b>. Мамандық таңдау, грант мүмкіндігі, университет немесе ҰБТ пәндері туралы кез келген сұрағыңды қой.');
  </script>
</body>
</html>
