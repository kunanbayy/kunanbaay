<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800;900&family=Golos+Text:wght@400;500;600;700;800;900&family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Golos Text','Noto Sans',Arial,sans-serif; background: #FFFFFF; color: #0F172A; letter-spacing:-0.005em; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body::before { content:''; position:fixed; inset:0; z-index:-2; pointer-events:none;
      background:
        radial-gradient(680px 520px at 10% 6%, rgba(96,165,250,0.16), transparent 60%),
        radial-gradient(620px 560px at 92% 12%, rgba(59,130,246,0.13), transparent 58%),
        radial-gradient(720px 600px at 82% 90%, rgba(125,211,252,0.16), transparent 62%),
        radial-gradient(560px 460px at 18% 86%, rgba(96,165,250,0.11), transparent 60%), #FFFFFF; }
    ::selection { background:#F2B84B; color:#0B1E33; }
    :focus-visible { outline:2px solid #E0992E; outline-offset:2px; border-radius:4px; }
    a { text-decoration: none; color: inherit; }
    :root { --ink:#0B1E33; --navy: #1E3A5F; --orange: #F97316; --gold:#F2B84B; --gold-deep:#E0992E; --gray: #FFFFFF; --gray2: #F4F6F9; --border: #E6E8EC; --muted: #64748B; --fd: 'Unbounded','Golos Text','Noto Sans',sans-serif; }

    .nav { position: sticky; top: 0; z-index: 100; height: 62px; background: rgba(255,255,255,.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); display: flex; align-items: center; }
    .nav-inner { max-width: 1200px; margin: 0 auto; width: 100%; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; }

    .nav-links { display: flex; align-items: center; gap: 2px; }
    .nav-link { padding: 7px 13px; border-radius: 999px; font-size: 0.875rem; font-weight: 500; color: var(--muted); transition: .15s; }
    .nav-link:hover, .nav-link.active { color: var(--navy); background: var(--gray2); }
    .nav-actions { display: flex; gap: 8px; }
    .nav-mobile-btn { display: none; background: none; border: none; cursor: pointer; color: var(--navy); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 20px; border-radius: 999px; font-weight: 600; font-size: 0.875rem; border: 2px solid transparent; cursor: pointer; transition: .16s; font-family: 'Manrope','Noto Sans',Arial,sans-serif; }
    .btn-navy { background: var(--navy); color: #fff; }

    .search-wrap:focus-within { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(30,58,95,.07); }
    .search-wrap input { flex: 1; border: none; outline: none; font-family: 'Golos Text','Noto Sans',Arial,sans-serif; font-size: 0.875rem; color: #0F172A; background: transparent; }
    .search-wrap input::placeholder { color: #94A3B8; }
    .region-select-wrap { display: flex; align-items: center; border: 1.5px solid var(--border); border-radius: 10px; background: #fff; overflow: hidden; transition: .15s; flex-shrink: 0; }
    .region-select-wrap:focus-within { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(30,58,95,.07); }
    .region-select { border: none; outline: none; padding: 10px 12px 10px 14px; font-family: 'Golos Text','Noto Sans',Arial,sans-serif; font-size: 0.875rem; font-weight: 600; color: #0F172A; background: transparent; cursor: pointer; appearance: none; -webkit-appearance: none; min-width: 160px; }
    .region-chevron { pointer-events: none; padding: 0 10px; color: #94A3B8; display: flex; align-items: center; }
    .region-clear { border: none; background: none; padding: 0 10px 0 0; cursor: pointer; color: #94A3B8; display: none; align-items: center; font-size: 1rem; line-height: 1; }
    .region-clear.visible { display: flex; }
    .region-clear:hover { color: #EF4444; }

    .uni-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); cursor: pointer; transition: .15s; }

    .d-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .d-cell { background: var(--gray); border-radius: 8px; padding: 10px 12px; }
    .d-lbl { font-size: 0.7rem; color: var(--muted); margin-bottom: 3px; }
    .d-val { font-weight: 700; color: #0F172A; font-size: 0.82rem; overflow-wrap: anywhere; word-break: break-word; }
    a.d-val { color: var(--navy, #1E3A5F); text-decoration: none; display: inline-flex; align-items: center; gap: 5px; transition: color .15s; }

    a.d-val::after { content: '↗'; font-size: 0.78rem; opacity: .7; }
    .d-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .d-btn-o { background: var(--orange); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 700; font-size: 0.82rem; cursor: pointer; font-family: 'Manrope', 'Noto Sans', Arial, sans-serif; }

    @media (max-width: 768px) {
      .nav-links, .nav-actions { display: none; }

    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

<script>
function makeUniversityShortName(name) {
  const clean = String(name || '').replace(/[«»"()]/g, ' ').replace(/\s+/g, ' ').trim();
  const preferred = clean.match(/[A-ZА-ЯӘІҢҒҮҰҚӨҺ]{2,}/g);
  if (preferred && preferred.length) return preferred.slice(0, 2).join('').slice(0, 7);
  return clean.split(' ').filter(Boolean).slice(0, 3).map(word => word[0]).join('').toUpperCase() || 'ЖОО';
}

const UNI_DATA = (window.getEnrichedUniversities ? window.getEnrichedUniversities() : (window.UNIVERSITIES_SEED || []))
  .map(uni => ({
    ...uni,
    name: (window.kazifyUni ? window.kazifyUni(uni.name_kz) : uni.name_kz),
    abbr: uni.short_name || makeUniversityShortName(uni.name_kz),
    cityLabel: uni.city || '—',
    typeLabel: uni.university_type || '—',
    categoryLabel: uni.category || '—',
    logo: uni.logo_url || null,
    descriptionText: uni.description || 'ENIC Kazakhstan ресми тізімінен қосылды.',
  }));
let currentCity = '';

function populateRegionSelect() {
  const select = document.getElementById('regionSelect');
  if (!select) return;
  const previous = select.value;
  const cities = [...new Set(UNI_DATA.map(u => u.city).filter(Boolean).filter(c => c !== '—'))]
    .sort((a, b) => a.localeCompare(b, 'kk'));
  select.replaceChildren();
  const all = document.createElement('option');
  all.value = '';
  all.textContent = 'Барлық аймақ';
  select.appendChild(all);
  cities.forEach(city => {
    const option = document.createElement('option');
    option.value = city;
    option.textContent = city;
    select.appendChild(option);
  });
  if (cities.includes(previous)) {
    select.value = previous;
  }
}

function appendUniversityPlaceholder(container, u, compact) {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'width:100%;height:100%;background:#fff;border:1.5px solid #CBD5E1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;color:#1E3A5F;text-align:center;padding:5px;font-family:"Manrope","Noto Sans",Arial,sans-serif;';
  const abbr = document.createElement('strong');
  abbr.style.cssText = 'font-size:' + (compact ? '0.7rem' : '0.78rem') + ';font-weight:800;line-height:1.05;max-width:100%;overflow:hidden;text-overflow:ellipsis;';
  abbr.textContent = u.abbr;
  const label = document.createElement('span');
  label.style.cssText = 'font-size:' + (compact ? '0.48rem' : '0.52rem') + ';font-weight:700;color:#64748B;line-height:1.05;margin-top:3px;';
  label.textContent = 'Логотип қосылмаған';
  wrap.appendChild(abbr);
  wrap.appendChild(label);
  container.appendChild(wrap);
}

function renderUniversityLogo(container, u, compact) {
  container.replaceChildren();
  if (u.logo_url) {
    const img = document.createElement('img');
    img.src = u.logo_url;
    img.alt = u.name;
    img.onerror = function () {
      this.remove();
      appendUniversityPlaceholder(container, u, compact);
    };
    container.appendChild(img);
  } else {
    appendUniversityPlaceholder(container, u, compact);
  }
}

function onRegionChange() {
  currentCity = document.getElementById('regionSelect').value;
  const clearBtn = document.getElementById('regionClear');
  if (clearBtn) clearBtn.classList.toggle('visible', !!currentCity);
  renderUnis();
}

function clearRegion() {
  document.getElementById('regionSelect').value = '';
  currentCity = '';
  const clearBtn = document.getElementById('regionClear');
  if (clearBtn) clearBtn.classList.remove('visible');
  renderUnis();
}

function renderUnis() {
  const search = (document.getElementById('searchInput').value || '').toLowerCase();
  const filtered = UNI_DATA.filter(u => {
    const cityText = u.city || '';
    const c = !currentCity || cityText === currentCity;
    const haystack = [u.name_kz, u.name_ru, u.name_en, u.short_name, u.city, u.official_website, u.code, u.category].filter(Boolean).join(' ').toLowerCase();
    const s = !search || haystack.includes(search);
    return c && s;
  });
  const li = isLoggedIn();
  const pp = isPremium();
  const limit = !li ? 3 : (pp ? filtered.length : 3);
  const shown = filtered.slice(0, limit);
  document.getElementById('uniCountLabel').textContent = filtered.length;
  const grid = document.getElementById('uniGrid');
  grid.replaceChildren();
  shown.forEach(u => {
    const item = document.createElement('div');
    item.className = 'uni-item fade-in';
    item.addEventListener('click', () => openDetail(u));
    const lw = document.createElement('div');
    lw.className = 'uni-logo-wrap';
    renderUniversityLogo(lw, u, true);
    const info = document.createElement('div');
    info.className = 'uni-info';
    const nm = document.createElement('div');
    nm.className = 'uni-name';
    nm.textContent = u.name;
    const mt = document.createElement('div');
    mt.className = 'uni-meta';
    mt.textContent = u.city ? 'Қала: ' + u.city : 'Қала кейін толтырылады';
    info.appendChild(nm);
    info.appendChild(mt);
    const ch = document.createElement('div');
    ch.className = 'uni-chev';
    ch.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>';
    item.appendChild(lw);
    item.appendChild(info);
    item.appendChild(ch);
    grid.appendChild(item);
  });
  const gate = document.getElementById('freeGate');
  if (!li || ((!pp) && filtered.length > 3)) {
    gate.style.display = '';
    const t = document.getElementById('freeGateTitle');
    t.textContent = !li ? filtered.length + ' университет табылды. Тіркеліп, толық тізімді ашыңыз.' : filtered.length + ' университет табылды. Free нұсқада тек 3 ЖОО көрінеді. Premium-де барлығы ашылады.';
  } else {
    gate.style.display = 'none';
  }
}

function fieldValue(value, fallback) {
  return value || fallback || 'Кейін толтырылады';
}

function openDetail(u) {
  const ov = document.getElementById('detailModal');
  const body = document.getElementById('detailBody');
  ov.classList.add('open');
  body.replaceChildren();
  const cl = document.createElement('button');
  cl.className = 'd-close';
  cl.textContent = '✕';
  cl.addEventListener('click', () => ov.classList.remove('open'));
  const row = document.createElement('div');
  row.className = 'd-row';
  const lw = document.createElement('div');
  lw.className = 'd-logo';
  renderUniversityLogo(lw, u, false);
  const tw = document.createElement('div');
  const nm = document.createElement('div');
  nm.className = 'd-name';
  nm.textContent = u.name;
  const ct = document.createElement('div');
  ct.className = 'd-city';
  ct.textContent = '📍 ' + u.cityLabel + ' · ' + u.typeLabel;
  tw.appendChild(nm);
  tw.appendChild(ct);
  row.appendChild(lw);
  row.appendChild(tw);
  const desc = document.createElement('p');
  desc.style.cssText = 'font-size:0.82rem;color:#64748B;line-height:1.6;margin:-4px 0 16px;';
  desc.textContent = u.descriptionText;
  const dg = document.createElement('div');
  dg.className = 'd-grid';
  function prettyUrl(u){ try { return u.replace(/^https?:\/\//,'').replace(/\/$/,''); } catch(e){ return u; } }
  [
    ['Қысқаша атауы', fieldValue(u.short_name || u.abbr), null],
    ['Категория', fieldValue(u.category), null],
    ['Ресми сайт', u.official_website ? prettyUrl(u.official_website) : 'Кейін қосылады', u.official_website || null],
    ['Логотип дереккөзі', u.logo_source_url ? 'Сілтемені ашу' : 'Кейін қосылады', u.logo_source_url || null]
  ].forEach(([l, v, url]) => {
    const c = document.createElement('div');
    c.className = 'd-cell';
    const lb = document.createElement('div');
    lb.className = 'd-lbl';
    lb.textContent = l;
    let vl;
    if (url) {
      vl = document.createElement('a');
      vl.className = 'd-val';
      vl.href = url;
      vl.target = '_blank';
      vl.rel = 'noopener noreferrer';
    } else {
      vl = document.createElement('div');
      vl.className = 'd-val';
    }
    vl.textContent = v;
    c.appendChild(lb);
    c.appendChild(vl);
    dg.appendChild(c);
  });
  const ac = document.createElement('div');
  ac.className = 'd-actions';
  const b1 = document.createElement('button');
  b1.className = 'd-btn-o';
  b1.textContent = 'Грант есепте';
  b1.addEventListener('click', () => window.location.href = 'grant.html');
  const b2 = document.createElement('button');
  b2.className = 'd-btn-n';
  b2.textContent = 'Мамандықтар';
  b2.addEventListener('click', () => window.location.href = 'specialties.html');
  ac.appendChild(b1);
  ac.appendChild(b2);
  body.appendChild(cl);
  body.appendChild(row);
  body.appendChild(desc);
  body.appendChild(dg);
  body.appendChild(ac);
}


document.addEventListener('DOMContentLoaded', () => {
  ShyraqGate.guardPage('Университеттер тізімін пайдалану үшін тіркелу керек.');
  populateRegionSelect();
  renderUnis();
});
</script>
