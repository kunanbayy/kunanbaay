<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ЖОО — Shyraq Education</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Manrope','Noto Sans',Arial,sans-serif; background: #ffffff; color: #0F172A; -webkit-font-smoothing: antialiased; }
    a { text-decoration: none; color: inherit; }
    :root { --navy: #1E3A5F; --orange: #F97316; --gray: #F8FAFC; --gray2: #F1F5F9; --border: #E2E8F0; --muted: #64748B; --fd: 'Manrope','Noto Sans',Arial,sans-serif; }
    .nav { position: sticky; top: 0; z-index: 100; height: 62px; background: rgba(255,255,255,.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); display: flex; align-items: center; }
    .nav-inner { max-width: 1200px; margin: 0 auto; width: 100%; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { display: flex; align-items: center; gap: 9px; font-family: var(--fd); font-weight: 800; font-size: 1.18rem; color: var(--navy); }
    .nav-logo-mark { width: 34px; height: 34px; background: var(--navy); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.95rem; }
    .nav-links { display: flex; align-items: center; gap: 2px; }
    .nav-link { padding: 7px 13px; border-radius: 999px; font-size: 0.875rem; font-weight: 500; color: var(--muted); transition: .15s; }
    .nav-link:hover, .nav-link.active { color: var(--navy); background: var(--gray2); }
    .nav-actions { display: flex; gap: 8px; }
    .nav-mobile-btn { display: none; background: none; border: none; cursor: pointer; color: var(--navy); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 20px; border-radius: 999px; font-weight: 600; font-size: 0.875rem; border: 2px solid transparent; cursor: pointer; transition: .16s; font-family: 'Manrope','Noto Sans',Arial,sans-serif; }
    .btn-navy { background: var(--navy); color: #fff; }
    .btn-navy:hover { background: #16305A; }
    .btn-sm { padding: 7px 14px; font-size: 0.8rem; }
    .btn-full { width: 100%; justify-content: center; }
    .page { max-width: 1100px; margin: 0 auto; padding: 36px 24px 80px; }
    .page-title { font-family: var(--fd); font-size: 2rem; font-weight: 800; color: #0F172A; margin-bottom: 20px; }
    .page-divider { height: 1px; background: var(--border); margin-bottom: 24px; }
    .filter-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    .type-tabs { display: flex; border: 2px solid #0F172A; border-radius: 10px; overflow: hidden; }
    .type-tab { padding: 9px 22px; font-size: 0.875rem; font-weight: 700; cursor: pointer; background: #fff; color: #0F172A; border: none; transition: .15s; font-family: 'Manrope', 'Noto Sans', Arial, sans-serif; }
    .type-tab.active { background: #0F172A; color: #fff; }
    .search-wrap { display: flex; align-items: center; gap: 9px; border: 1.5px solid var(--border); border-radius: 10px; padding: 9px 14px; flex: 1; min-width: 180px; background: #fff; transition: .15s; }
    .search-wrap:focus-within { border-color: var(--navy); }
    .search-wrap input { flex: 1; border: none; outline: none; font-family: 'Manrope', 'Noto Sans', Arial, sans-serif; font-size: 0.875rem; color: #0F172A; background: transparent; }
    .search-wrap input::placeholder { color: #94A3B8; }
    .city-select-btn { display: flex; align-items: center; gap: 8px; padding: 9px 16px; border: 1.5px solid var(--border); border-radius: 10px; background: #fff; font-size: 0.875rem; font-weight: 600; color: #0F172A; cursor: pointer; transition: .15s; white-space: nowrap; font-family: 'Manrope', 'Noto Sans', Arial, sans-serif; }
    .city-select-btn:hover { border-color: var(--navy); color: var(--navy); }
    .city-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .city-pill { display: flex; align-items: center; gap: 6px; padding: 7px 16px; border-radius: 999px; border: 1.5px solid var(--border); font-size: 0.8rem; font-weight: 600; color: #0F172A; background: #fff; cursor: pointer; transition: .15s; font-family: 'Manrope', 'Noto Sans', Arial, sans-serif; }
    .city-pill:hover { border-color: #94A3B8; }
    .city-pill.active { background: #0F172A; color: #fff; border-color: #0F172A; }
    .city-pill .c-dot { width: 8px; height: 8px; background: var(--orange); border-radius: 50%; flex-shrink: 0; }
    .uni-count { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: #94A3B8; margin-bottom: 16px; }
    .uni-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-top: 1px solid var(--border); border-left: 1px solid var(--border); }
    .uni-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); cursor: pointer; transition: .15s; }
    .uni-item:hover { background: var(--gray); }
    .uni-logo-wrap { width: 56px; height: 56px; border-radius: 10px; border: 1.5px solid var(--border); overflow: hidden; flex-shrink: 0; background: #fff; display: flex; align-items: center; justify-content: center; position: relative; }
    .uni-logo-wrap img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
    .uni-star { position: absolute; top: -4px; right: -4px; width: 16px; height: 16px; background: var(--orange); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .uni-info { flex: 1; min-width: 0; }
    .uni-name { font-weight: 700; font-size: 0.875rem; color: #0F172A; margin-bottom: 3px; line-height: 1.35; }
    .uni-meta { font-size: 0.75rem; color: var(--muted); }
    .uni-chev { color: #CBD5E1; flex-shrink: 0; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 500; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .city-modal { background: #fff; border-radius: 20px; width: 100%; max-width: 480px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.15); }
    .city-modal-body { flex: 1; overflow-y: auto; }
    .city-option { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; cursor: pointer; transition: .12s; border-bottom: 1px solid #F1F5F9; }
    .city-option:hover { background: #F8FAFC; }
    .city-opt-name { font-size: 0.925rem; font-weight: 500; color: #0F172A; }
    .city-option.selected .city-opt-name { color: var(--orange); font-weight: 700; }
    .city-opt-check { color: var(--orange); opacity: 0; }
    .city-option.selected .city-opt-check { opacity: 1; }
    .city-modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
    .btn-cancel { flex: 1; padding: 13px; background: #fff; border: 2px solid var(--border); border-radius: 12px; font-weight: 700; font-size: 0.9rem; cursor: pointer; font-family: 'Manrope', 'Noto Sans', Arial, sans-serif; }
    .btn-save { flex: 1; padding: 13px; background: var(--orange); border: none; border-radius: 12px; color: #fff; font-weight: 700; font-size: 0.9rem; cursor: pointer; font-family: 'Manrope', 'Noto Sans', Arial, sans-serif; }
    .btn-save:hover { background: #ea6c0f; }
    .detail-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 600; align-items: center; justify-content: center; padding: 20px; }
    .detail-overlay.open { display: flex; }
    .detail-modal { background: #fff; border-radius: 20px; width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto; padding: 32px; box-shadow: 0 20px 60px rgba(0,0,0,.15); position: relative; }
    .d-close { position: absolute; top: 14px; right: 14px; background: var(--gray); border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; color: var(--muted); }
    .d-logo { width: 68px; height: 68px; border-radius: 12px; border: 1.5px solid var(--border); overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .d-logo img { width: 100%; height: 100%; object-fit: contain; padding: 5px; }
    .d-row { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
    .d-name { font-family: var(--fd); font-weight: 800; font-size: 1.1rem; color: #0F172A; margin-bottom: 4px; line-height: 1.3; }
    .d-city { font-size: 0.8rem; color: var(--muted); }
    .d-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .d-cell { background: var(--gray); border-radius: 8px; padding: 10px 12px; }
    .d-lbl { font-size: 0.7rem; color: var(--muted); margin-bottom: 3px; }
    .d-val { font-weight: 700; color: #0F172A; font-size: 0.82rem; }
    .d-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .d-btn-o { background: var(--orange); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 700; font-size: 0.82rem; cursor: pointer; font-family: 'Manrope', 'Noto Sans', Arial, sans-serif; }
    .d-btn-n { background: #fff; color: var(--navy); border: 2px solid var(--border); padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 0.82rem; cursor: pointer; font-family: 'Manrope', 'Noto Sans', Arial, sans-serif; }
    .mobile-menu { display: none; position: fixed; inset: 0; z-index: 200; background: #fff; padding: 20px; flex-direction: column; }
    .mobile-menu.open { display: flex; }
    .mm-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
    .mm-links { display: flex; flex-direction: column; gap: 3px; }
    .mm-link { padding: 13px 14px; border-radius: 10px; font-size: 0.95rem; font-weight: 500; }
    .mm-link:hover { background: var(--gray2); }
    .mm-actions { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
    @media (max-width: 768px) {
      .nav-links, .nav-actions { display: none; }
      .nav-mobile-btn { display: flex; align-items: center; }
      .uni-grid { grid-template-columns: 1fr; }
      .filter-row { flex-direction: column; align-items: stretch; }
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .fade-in { animation: fadeIn .25s ease both; }
  </style>
</head>

<script>
function makeUniversityShortName(name) {
  const clean = String(name || '').replace(/[«»"()]/g, ' ').replace(/\s+/g, ' ').trim();
  const preferred = clean.match(/[A-ZА-ЯӘІҢҒҮҰҚӨҺ]{2,}/g);
  if (preferred && preferred.length) return preferred.slice(0, 2).join('').slice(0, 7);
  return clean.split(' ').filter(Boolean).slice(0, 3).map(word => word[0]).join('').toUpperCase() || 'ЖОО';
}

const UNI_DATA = (window.getEnrichedUniversities ? window.getEnrichedUniversities() : (window.UNIVERSITIES_SEED || []))
  .map(uni => ({
    ...uni,
    name: uni.name_kz,
    abbr: uni.short_name || makeUniversityShortName(uni.name_kz),
    cityLabel: uni.city || '—',
    typeLabel: uni.university_type || '—',
    categoryLabel: uni.category || '—',
    logo: uni.logo_url || null,
    descriptionText: uni.description || 'ENIC Kazakhstan ресми тізімінен қосылды.',
  }));
const KZ_CITIES = ['Барлық қалалар', 'Алматы қаласы', 'Астана қаласы', 'Шымкент қаласы', 'Ақмола облысы', 'Ақтөбе облысы', 'Алматы облысы', 'Атырау облысы', 'Шығыс Қазақстан облысы', 'Жамбыл облысы', 'Батыс Қазақстан облысы', 'Қарағанды облысы', 'Қостанай облысы', 'Қызылорда облысы', 'Маңғыстау облысы', 'Павлодар облысы', 'Солтүстік Қазақстан облысы', 'Түркістан облысы'];
let currentCity = 'all';
let tempCity = 'Барлық қалалар';

function appendUniversityPlaceholder(container, u, compact) {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'width:100%;height:100%;background:#fff;border:1.5px solid #CBD5E1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;color:#1E3A5F;text-align:center;padding:5px;font-family:"Manrope","Noto Sans",Arial,sans-serif;';
  const abbr = document.createElement('strong');
  abbr.style.cssText = 'font-size:' + (compact ? '0.7rem' : '0.78rem') + ';font-weight:800;line-height:1.05;max-width:100%;overflow:hidden;text-overflow:ellipsis;';
  abbr.textContent = u.abbr;
  const label = document.createElement('span');
  label.style.cssText = 'font-size:' + (compact ? '0.48rem' : '0.52rem') + ';font-weight:700;color:#64748B;line-height:1.05;margin-top:3px;';
  label.textContent = 'Логотип қосылмаған';
  wrap.appendChild(abbr);
  wrap.appendChild(label);
  container.appendChild(wrap);
}

function renderUniversityLogo(container, u, compact) {
  container.replaceChildren();
  if (u.logo_url) {
    const img = document.createElement('img');
    img.src = u.logo_url;
    img.alt = u.name;
    img.onerror = function () {
      this.remove();
      appendUniversityPlaceholder(container, u, compact);
    };
    container.appendChild(img);
  } else {
    appendUniversityPlaceholder(container, u, compact);
  }
}

function filterCity(city, btn) {
  currentCity = city;
  document.querySelectorAll('.city-pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  renderUnis();
}

function renderUnis() {
  const search = (document.getElementById('searchInput').value || '').toLowerCase();
  const filtered = UNI_DATA.filter(u => {
    const cityText = u.city || '';
    const c = currentCity === 'all' || cityText.includes(currentCity);
    const haystack = [u.name_kz, u.name_ru, u.name_en, u.short_name, u.city, u.official_website].filter(Boolean).join(' ').toLowerCase();
    const s = !search || haystack.includes(search);
    return c && s;
  });
  const li = isLoggedIn();
  const pp = isPremium();
  const limit = !li ? 3 : (pp ? filtered.length : 3);
  const shown = filtered.slice(0, limit);
  document.getElementById('uniCountLabel').textContent = filtered.length;
  const grid = document.getElementById('uniGrid');
  grid.replaceChildren();
  shown.forEach(u => {
    const item = document.createElement('div');
    item.className = 'uni-item fade-in';
    item.addEventListener('click', () => openDetail(u));
    const lw = document.createElement('div');
    lw.className = 'uni-logo-wrap';
    renderUniversityLogo(lw, u, true);
    const info = document.createElement('div');
    info.className = 'uni-info';
    const nm = document.createElement('div');
    nm.className = 'uni-name';
    nm.textContent = u.name;
    const mt = document.createElement('div');
    mt.className = 'uni-meta';
    mt.textContent = u.city ? 'Қала: ' + u.city : 'Қала кейін толтырылады';
    info.appendChild(nm);
    info.appendChild(mt);
    const ch = document.createElement('div');
    ch.className = 'uni-chev';
    ch.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>';
    item.appendChild(lw);
    item.appendChild(info);
    item.appendChild(ch);
    grid.appendChild(item);
  });
  const gate = document.getElementById('freeGate');
  if (!li || ((!pp) && filtered.length > 3)) {
    gate.style.display = '';
    const t = document.getElementById('freeGateTitle');
    t.textContent = !li ? filtered.length + ' университет табылды. Тіркеліп, толық тізімді ашыңыз.' : filtered.length + ' университет табылды. Free нұсқада тек 3 ЖОО. Premium-де барлығы ашылады.';
  } else {
    gate.style.display = 'none';
  }
}

function fieldValue(value, fallback) {
  return value || fallback || 'Кейін толтырылады';
}

function openDetail(u) {
  const ov = document.getElementById('detailModal');
  const body = document.getElementById('detailBody');
  ov.classList.add('open');
  body.replaceChildren();
  const cl = document.createElement('button');
  cl.className = 'd-close';
  cl.textContent = '✕';
  cl.addEventListener('click', () => ov.classList.remove('open'));
  const row = document.createElement('div');
  row.className = 'd-row';
  const lw = document.createElement('div');
  lw.className = 'd-logo';
  renderUniversityLogo(lw, u, false);
  const tw = document.createElement('div');
  const nm = document.createElement('div');
  nm.className = 'd-name';
  nm.textContent = u.name;
  const ct = document.createElement('div');
  ct.className = 'd-city';
  ct.textContent = '📍 ' + u.cityLabel + ' · ' + u.typeLabel;
  tw.appendChild(nm);
  tw.appendChild(ct);
  row.appendChild(lw);
  row.appendChild(tw);
  const desc = document.createElement('p');
  desc.style.cssText = 'font-size:0.82rem;color:#64748B;line-height:1.6;margin:-4px 0 16px;';
  desc.textContent = u.descriptionText;
  const dg = document.createElement('div');
  dg.className = 'd-grid';
  [
    ['Қысқаша атауы', fieldValue(u.short_name || u.abbr)],
    ['Категория', fieldValue(u.category)],
    ['Ресми сайт', fieldValue(u.official_website, 'Кейін қосылады')],
    ['Логотип дереккөзі', fieldValue(u.logo_source_url, 'Кейін қосылады')]
  ].forEach(([l, v]) => {
    const c = document.createElement('div');
    c.className = 'd-cell';
    const lb = document.createElement('div');
    lb.className = 'd-lbl';
    lb.textContent = l;
    const vl = document.createElement('div');
    vl.className = 'd-val';
    vl.textContent = v;
    c.appendChild(lb);
    c.appendChild(vl);
    dg.appendChild(c);
  });
  const ac = document.createElement('div');
  ac.className = 'd-actions';
  const b1 = document.createElement('button');
  b1.className = 'd-btn-o';
  b1.textContent = 'Грант есепте';
  b1.addEventListener('click', () => window.location.href = 'grant.html');
  const b2 = document.createElement('button');
  b2.className = 'd-btn-n';
  b2.textContent = 'Мамандықтар';
  b2.addEventListener('click', () => window.location.href = 'specialties.html');
  ac.appendChild(b1);
  ac.appendChild(b2);
  body.appendChild(cl);
  body.appendChild(row);
  body.appendChild(desc);
  body.appendChild(dg);
  body.appendChild(ac);
}

function openCityModal() {
  const modal = document.getElementById('cityModal');
  const body = document.getElementById('cityModalBody');
  modal.classList.add('open');
  body.replaceChildren();
  KZ_CITIES.forEach(city => {
    const opt = document.createElement('div');
    opt.className = 'city-option' + (city === tempCity ? ' selected' : '');
    const nm = document.createElement('div');
    nm.className = 'city-opt-name';
    nm.textContent = city;
    const ch = document.createElement('div');
    ch.className = 'city-opt-check';
    ch.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>';
    opt.appendChild(nm);
    opt.appendChild(ch);
    opt.addEventListener('click', () => {
      document.querySelectorAll('.city-option').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      tempCity = city;
    });
    body.appendChild(opt);
  });
}

function closeCityModal() {
  document.getElementById('cityModal').classList.remove('open');
}

function saveCitySelection() {
  closeCityModal();
  if (tempCity === 'Барлық қалалар') {
    filterCityFromModal('all');
  } else {
    const k = tempCity.replace(' қаласы', '').replace(' облысы', '');
    filterCityFromModal(k);
  }
}

function filterCityFromModal(k) {
  currentCity = k;
  document.querySelectorAll('.city-pill').forEach(p => p.classList.remove('active'));
  const m = document.querySelector('.city-pill[data-city="' + k + '"]');
  if (m) m.classList.add('active');
  else document.querySelector('.city-pill[data-city="all"]').classList.add('active');
  renderUnis();
}

document.addEventListener('DOMContentLoaded', () => {
  ShyraqGate.guardPage('Университеттер тізімін пайдалану үшін тіркелу керек.');
  renderUnis();
});
</script>
