<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мамандық тесті — Shyraq Education</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { background: #F8FAFC; }
    .test-exit { background: none; border: none; color: var(--text-muted); font-size: 0.875rem; display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 8px 12px; border-radius: var(--radius); transition: var(--transition); }
    .test-exit:hover { background: #EFEFF6; color: var(--navy); }
    .question-enter { animation: slideIn 0.3s ease both; }
    @keyframes slideIn { from { opacity:0; transform: translateX(20px); } to { opacity:1; transform:translateX(0); } }
    .scale-opts { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .scale-btn { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 15px 18px; border-radius: 14px; border: 1.5px solid var(--border); background: #fff; cursor: pointer; transition: .15s; font-family: var(--font-body); font-size: 0.96rem; color: var(--text); }
    .scale-btn:hover { border-color: #C7CDFB; background: #FAFAFF; }
    .scale-btn.selected { border-color: #6D5DFC; background: #F2F0FF; color: #1B1340; font-weight: 700; }
    .scale-dot { width: 26px; height: 26px; flex: 0 0 26px; border-radius: 50%; border: 2px solid #CBD0E0; display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 800; color: #94A3B8; }
    .scale-btn.selected .scale-dot { border-color: #6D5DFC; background: #6D5DFC; color: #fff; }
  </style>
</head>
<body>
<div class="test-page">
  <div class="test-topbar">
    <a href="index.html" class="test-topbar-logo">🔆 Shyraq</a>
    <div class="test-progress-wrap">
      <div class="test-progress-label"><span id="progressLabel">Сұрақ 1 / 25</span></div>
      <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:4%"></div></div>
    </div>
    <button class="test-exit" onclick="if(confirm('Тестті тоқтатасыз ба? Прогресс сақталмайды.'))window.location.href='index.html'">✕ Шығу</button>
  </div>

  <div class="test-body">
    <div class="test-card" id="testCard">
      <div class="question-num" id="qNum">СҰРАҚ 1</div>
      <div class="question-text" id="qText">Жүктелуде...</div>
      <div class="scale-opts" id="answerOptions"></div>
      <div class="test-actions">
        <button class="btn btn-ghost" id="prevBtn" onclick="prevQuestion()" style="display:none">← Алдыңғы</button>
        <div id="skipInfo" style="font-size:0.8rem;color:var(--text-light)">Бір жауапты таңдаңыз</div>
        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>Келесі →</button>
      </div>
    </div>
  </div>
</div>

<script src="js/main.js"></script>
<script>
/* 25 questions, each adds weighted points to ability clusters */
const QUESTIONS = [
  { t:'Күрделі мәселенің шешімін іздеу маған қызық.', w:{IT:2,SCI:2,ENG:1} },
  { t:'Жаңа технологиялар мен цифрлық құралдарды тез меңгеремін.', w:{IT:3,ENG:1} },
  { t:'Адамдарға бағыт беріп, ұйымдастыру маған ұнайды.', w:{BUS:2,PED:2,LAW:1} },
  { t:'Басқалардың мәселесін тыңдап, көмектесуге тырысамын.', w:{PSY:3,MED:2,PED:1} },
  { t:'Өз идеяларымды ұсынудан қорықпаймын.', w:{BUS:2,ART:2} },
  { t:'Сандық деректермен және кестелермен жұмыс жасау қызықты.', w:{IT:2,SCI:2,BUS:1} },
  { t:'Құрылғылардың немесе жүйелердің қалай жұмыс істейтінін білгім келеді.', w:{ENG:3,IT:2} },
  { t:'Болашақта өз кәсібімді ашқым келеді.', w:{BUS:3,LAW:1} },
  { t:'Ғылыми жаңалықтар мен зерттеулерді оқығанды ұнатамын.', w:{SCI:3,MED:1} },
  { t:'Балаларға немесе басқа адамдарға бір нәрсе үйреткен ұнайды.', w:{PED:3,PSY:1} },
  { t:'Көпшілік алдында сөйлеу маған қиын емес.', w:{BUS:2,LAW:2,PED:1} },
  { t:'Сурет салу, дизайн жасау немесе шығармашылық жұмыстар қызықтырады.', w:{ART:3} },
  { t:'Қиын жағдайда тез шешім қабылдай аламын.', w:{LAW:2,BUS:2,MED:1} },
  { t:'Адамдардың мінез-құлқын түсіну қызықты.', w:{PSY:3,PED:1} },
  { t:'Денсаулық сақтау немесе медицина тақырыптары қызықтырады.', w:{MED:3} },
  { t:'Математикалық есептерді шығарудан ләззат аламын.', w:{SCI:2,IT:2,ENG:1} },
  { t:'Табиғат, экология немесе қоршаған орта мәселелері қызықтырады.', w:{SCI:2,MED:2} },
  { t:'Заңдар мен әділдік мәселелері туралы ойланамын.', w:{LAW:3} },
  { t:'Тарих пен қоғамның дамуы туралы білгім келеді.', w:{HUM:2,LAW:1} },
  { t:'Шет тілдерін үйрену маған оңай.', w:{HUM:2,BUS:1} },
  { t:'Жоба немесе іс-шара ұйымдастыру тәжірибем бар.', w:{BUS:2,PED:2} },
  { t:'Зерттеу жүргізіп, ақпарат жинағанды ұнатамын.', w:{SCI:3,HUM:1} },
  { t:'Мен үшін тұрақты табыс емес, қызықты жұмыс маңыздырақ.', w:{ART:2,SCI:1} },
  { t:'Жауапкершілігі жоғары жұмыстардан қорықпаймын.', w:{MED:2,LAW:2,BUS:1} },
  { t:'Болашақ мамандығым арқылы қоғамға пайда әкелгім келеді.', w:{PED:2,MED:2,PSY:1} },
];

const SCALE = [
  { v:0, label:'Мүлдем келіспеймін' },
  { v:1, label:'Келіспеймін' },
  { v:2, label:'Бейтараппын' },
  { v:3, label:'Келісемін' },
  { v:4, label:'Толық келісемін' },
];

let current = 0;
const answers = {}; // qIndex -> points 0..4

function renderQuestion() {
  const q = QUESTIONS[current];
  const total = QUESTIONS.length;
  const pct = Math.round(((current + 1) / total) * 100);
  document.getElementById('progressLabel').textContent = `Сұрақ ${current + 1} / ${total}`;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('qNum').textContent = `СҰРАҚ ${current + 1}`;
  document.getElementById('qText').textContent = q.t;
  document.getElementById('qNum').className = 'question-num question-enter';

  const opts = document.getElementById('answerOptions');
  opts.innerHTML = '';
  SCALE.forEach((a) => {
    const btn = document.createElement('button');
    btn.className = 'scale-btn';
    if (answers[current] === a.v) btn.classList.add('selected');
    const dot = document.createElement('span');
    dot.className = 'scale-dot';
    dot.textContent = a.v + 1;
    const label = document.createElement('span');
    label.textContent = a.label;
    btn.appendChild(dot); btn.appendChild(label);
    btn.addEventListener('click', () => selectAnswer(a.v, btn));
    opts.appendChild(btn);
  });

  document.getElementById('prevBtn').style.display = current > 0 ? '' : 'none';
  document.getElementById('nextBtn').disabled = answers[current] === undefined;
  document.getElementById('nextBtn').textContent = current === total - 1 ? 'Нәтижені көру ✓' : 'Келесі →';
}

function selectAnswer(v, btn) {
  answers[current] = v;
  document.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  document.getElementById('nextBtn').disabled = false;
  document.getElementById('skipInfo').textContent = '';
  setTimeout(() => { if (current < QUESTIONS.length - 1) { current++; renderQuestion(); } }, 220);
}

function nextQuestion() { if (current < QUESTIONS.length - 1) { current++; renderQuestion(); } else finishTest(); }
function prevQuestion() { if (current > 0) { current--; renderQuestion(); } }

function finishTest() {
  const CLUSTERS = ['IT','ENG','MED','PED','PSY','BUS','LAW','HUM','SCI','ART'];
  const raw = {}, max = {};
  CLUSTERS.forEach(c => { raw[c] = 0; max[c] = 0; });
  QUESTIONS.forEach((q, i) => {
    const p = (answers[i] !== undefined) ? answers[i] : 2; // default neutral
    Object.keys(q.w).forEach(c => {
      raw[c] += p * q.w[c];
      max[c] += 4 * q.w[c];
    });
  });
  const pct = {};
  CLUSTERS.forEach(c => { pct[c] = max[c] ? Math.round((raw[c] / max[c]) * 100) : 0; });
  const ranked = CLUSTERS.slice().sort((a, b) => pct[b] - pct[a]);

  const results = {
    type: 'aptitude',
    clusters: pct,
    ranked: ranked,
    top: ranked.slice(0, 3),
    // legacy fields for dashboard preview compatibility
    direction: ranked[0],
    grant: pct[ranked[0]] >= 70 ? 'Жоғары' : 'Орташа',
    date: new Date().toISOString()
  };
  localStorage.setItem('shyraq_results', JSON.stringify(results));
  window.location.href = 'results.html';
}

document.addEventListener('DOMContentLoaded', renderQuestion);
</script>
</body>
</html>
