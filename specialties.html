<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мамандықтар — Shyraq Education</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    @font-face {
      font-family: 'Programme Pan';
      src: url('assets/fonts/Programme-Pan-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Programme Pan';
      src: url('assets/fonts/Programme-Pan-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --maj-ink: #111827;
      --maj-muted: #667085;
      --maj-soft: #F6F7FB;
      --maj-line: #E8ECF5;
      --maj-purple: #6D5EF6;
      --maj-purple-2: #8B5CF6;
      --maj-lavender: #F3EFFF;
      --maj-blue: #2563EB;
      --maj-green: #16A34A;
      --maj-pink: #E84BA1;
      --maj-shadow: 0 22px 60px rgba(31, 41, 55, .08);
      --maj-card-shadow: 0 14px 36px rgba(72, 76, 122, .08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--maj-ink);
      font-family: 'Programme Pan', Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(139, 92, 246, .14), transparent 32%),
        radial-gradient(circle at 88% 6%, rgba(37, 99, 235, .10), transparent 24%),
        linear-gradient(180deg, #FFFFFF 0%, #F8F7FF 42%, #F7F9FC 100%);
      overflow-x: hidden;
    }

    button,
    input {
      font-family: inherit;
    }

    .maj-page {
      width: min(1920px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px 20px 20px;
    }

    .maj-topbar {
      height: 58px;
      display: grid;
      grid-template-columns: 330px minmax(240px, 1fr) auto;
      gap: 28px;
      align-items: center;
      margin-bottom: 18px;
    }

    .maj-brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: #101433;
      text-decoration: none;
      min-width: 0;
    }

    .maj-brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #3B4BB3, #6D5EF6);
      color: #fff;
      box-shadow: 0 12px 28px rgba(109, 94, 246, .25);
    }

    .maj-brand span {
      font-size: clamp(24px, 1.7vw, 34px);
      font-weight: 800;
      letter-spacing: 0;
    }

    .maj-search {
      position: relative;
      width: min(370px, 100%);
      justify-self: center;
    }

    .maj-search svg {
      position: absolute;
      left: 20px;
      top: 50%;
      width: 21px;
      height: 21px;
      transform: translateY(-50%);
      color: #7881A6;
      pointer-events: none;
    }

    .maj-search input {
      width: 100%;
      height: 48px;
      border: 1px solid rgba(226, 232, 240, .9);
      border-radius: 13px;
      padding: 0 18px 0 56px;
      background: rgba(246, 247, 255, .9);
      color: #171B3A;
      font-size: 16px;
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
      transition: border .18s, box-shadow .18s, background .18s;
    }

    .maj-search input:focus {
      border-color: rgba(109, 94, 246, .42);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(109, 94, 246, .10);
    }

    .maj-tabs {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: clamp(10px, 1.25vw, 28px);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .maj-tabs::-webkit-scrollbar { display: none; }

    .maj-tab {
      appearance: none;
      border: 0;
      background: transparent;
      height: 44px;
      padding: 0 8px;
      color: #141833;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: color .18s, border-color .18s, background .18s;
    }

    .maj-tab:hover {
      color: var(--maj-purple);
    }

    .maj-tab.active {
      color: var(--maj-purple);
      border-bottom-color: var(--maj-purple);
    }

    .maj-shell {
      display: grid;
      grid-template-columns: 520px minmax(0, 1fr);
      gap: 18px;
      height: calc(100vh - 96px);
      min-height: 820px;
    }

    .maj-sidebar,
    .maj-main {
      border: 1px solid rgba(226, 232, 240, .86);
      background: rgba(255, 255, 255, .78);
      box-shadow: var(--maj-shadow);
      backdrop-filter: blur(18px);
    }

    .maj-sidebar {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 16px;
      padding: 0 0 18px;
      border-radius: 22px;
      min-width: 0;
      overflow: hidden;
    }

    .maj-promo {
      min-height: 198px;
      margin: 0;
      padding: 28px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 170px;
      gap: 10px;
      align-items: center;
      overflow: hidden;
      color: #fff;
      background:
        radial-gradient(circle at 82% 16%, rgba(255,255,255,.35), transparent 24%),
        linear-gradient(135deg, #5D45D9 0%, #8B5CF6 56%, #A855F7 100%);
    }

    .maj-promo h1 {
      margin: 0 0 12px;
      font-size: 23px;
      line-height: 1.16;
      letter-spacing: 0;
    }

    .maj-promo p {
      margin: 0;
      max-width: 290px;
      color: rgba(255,255,255,.86);
      font-size: 16px;
      line-height: 1.34;
    }

    .maj-students {
      position: relative;
      height: 162px;
      isolation: isolate;
    }

    .maj-students::before,
    .maj-students::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      background: rgba(255,255,255,.16);
      z-index: -1;
    }

    .maj-students::before {
      width: 128px;
      height: 128px;
      right: -18px;
      top: 2px;
    }

    .maj-students::after {
      width: 78px;
      height: 78px;
      left: 14px;
      bottom: 2px;
    }

    .student {
      position: absolute;
      bottom: 2px;
      width: 76px;
      height: 130px;
      filter: drop-shadow(0 16px 18px rgba(30, 20, 74, .18));
    }

    .student.one { left: 20px; }
    .student.two { right: 12px; transform: scale(.96); }
    .student .head {
      width: 44px;
      height: 44px;
      margin: 0 auto;
      border-radius: 50%;
      background: #FFD2A8;
      border: 4px solid rgba(255,255,255,.24);
      position: relative;
    }
    .student .head::before {
      content: "";
      position: absolute;
      left: 4px;
      top: -8px;
      width: 34px;
      height: 20px;
      border-radius: 20px 20px 8px 8px;
      background: #2F2854;
    }
    .student.two .head::before {
      left: -2px;
      width: 46px;
      height: 24px;
      border-radius: 50% 50% 12px 12px;
      background: #46205B;
    }
    .student .body {
      height: 82px;
      margin-top: 4px;
      border-radius: 24px 24px 18px 18px;
      background: linear-gradient(180deg, #3159D6, #1C347C);
      position: relative;
    }
    .student.two .body {
      background: linear-gradient(180deg, #FFCB57, #E8752E);
    }
    .student .body::after {
      content: "";
      position: absolute;
      right: -10px;
      top: 20px;
      width: 30px;
      height: 46px;
      border-radius: 8px;
      background: #FFE3A3;
      transform: rotate(-9deg);
      border: 3px solid rgba(255,255,255,.3);
    }

    .maj-list {
      padding: 0 18px;
      overflow-y: auto;
      min-height: 0;
      scrollbar-width: thin;
      scrollbar-color: rgba(109, 94, 246, .28) transparent;
    }

    .maj-list::-webkit-scrollbar { width: 6px; }
    .maj-list::-webkit-scrollbar-thumb { background: rgba(109, 94, 246, .28); border-radius: 20px; }

    .major-item {
      width: 100%;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 178px;
      gap: 14px;
      align-items: center;
      margin-bottom: 10px;
      padding: 12px;
      border: 1px solid var(--maj-line);
      border-radius: 15px;
      background: rgba(255,255,255,.9);
      color: inherit;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(31, 41, 55, .035);
      transition: transform .18s, border-color .18s, box-shadow .18s, background .18s;
    }

    .major-item:hover {
      transform: translateY(-1px);
      border-color: rgba(109, 94, 246, .35);
      box-shadow: var(--maj-card-shadow);
    }

    .major-item.active {
      border-color: rgba(109, 94, 246, .75);
      background: linear-gradient(180deg, rgba(247,244,255,.96), #fff);
      box-shadow: 0 0 0 4px rgba(109, 94, 246, .08), 0 16px 34px rgba(109, 94, 246, .10);
    }

    .major-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      font-size: 23px;
      background: var(--tone-bg);
      color: var(--tone);
    }

    .major-title {
      margin: 0 0 4px;
      color: #151936;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.22;
    }

    .major-code {
      color: #616B89;
      font-size: 12px;
      font-weight: 700;
    }

    .major-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      text-align: center;
    }

    .major-stat strong {
      display: block;
      color: #111633;
      font-size: 16px;
      line-height: 1;
    }

    .major-stat span {
      display: block;
      margin-top: 4px;
      color: #59627E;
      font-size: 11px;
      line-height: 1.05;
    }

    .all-majors-btn {
      height: 58px;
      margin: 0 18px;
      border: 1px solid rgba(109, 94, 246, .32);
      border-radius: 14px;
      color: #33268F;
      background: linear-gradient(180deg, #fff, #F9F7FF);
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      transition: transform .18s, box-shadow .18s;
    }

    .all-majors-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(109, 94, 246, .13);
    }

    .maj-main {
      display: flex;
      flex-direction: column;
      border-radius: 22px;
      padding: 26px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(109, 94, 246, .22) transparent;
    }

    .maj-main::-webkit-scrollbar { width: 7px; }
    .maj-main::-webkit-scrollbar-thumb { background: rgba(109, 94, 246, .22); border-radius: 20px; }

    .detail-hero {
      min-height: 286px;
      display: grid;
      grid-template-columns: 142px minmax(0, 1fr);
      gap: 26px;
      align-items: start;
      padding: 28px 34px;
      border: 1px solid var(--maj-line);
      border-radius: 20px;
      background: rgba(255,255,255,.82);
      box-shadow: var(--maj-card-shadow);
    }

    .hero-icon {
      width: 136px;
      height: 136px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      color: var(--tone);
      background:
        linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,255,255,.24)),
        var(--tone-bg);
      font-size: 72px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
    }

    .hero-code {
      display: inline-flex;
      align-items: center;
      height: 36px;
      padding: 0 18px;
      margin-bottom: 18px;
      border-radius: 10px;
      background: #ECEEF7;
      color: #20243D;
      font-size: 20px;
      font-weight: 800;
    }

    .detail-hero h2 {
      margin: 0 0 28px;
      color: #111633;
      font-size: clamp(28px, 2.1vw, 38px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(6, minmax(112px, 1fr));
      gap: 16px;
    }

    .hero-stat {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      min-width: 0;
    }

    .hero-stat-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      font-size: 24px;
      background: var(--stat-bg);
      color: var(--stat);
    }

    .hero-stat strong {
      display: block;
      color: #111633;
      font-size: 18px;
      line-height: 1.08;
      word-break: break-word;
    }

    .hero-stat span {
      display: block;
      margin-top: 4px;
      color: #5F6985;
      font-size: 13px;
      line-height: 1.12;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 18px;
      margin-top: 20px;
    }

    .detail-card {
      min-height: 210px;
      padding: 24px;
      border: 1px solid var(--maj-line);
      border-radius: 18px;
      background: rgba(255,255,255,.88);
      box-shadow: var(--maj-card-shadow);
    }

    .detail-card h3 {
      margin: 0 0 20px;
      color: #121630;
      font-size: 20px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .description-card p {
      margin: 0;
      color: #2C344E;
      font-size: 16px;
      line-height: 1.62;
    }

    .text-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 28px;
      color: var(--maj-purple);
      font-weight: 800;
      text-decoration: none;
    }

    .career-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px 18px;
    }

    .career-chip {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      min-height: 48px;
      color: #232942;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
    }

    .career-chip i {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--chip-bg);
      font-style: normal;
    }

    .chart-row {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) 44px;
      gap: 14px;
      align-items: center;
      margin: 17px 0;
      color: #17203A;
      font-size: 15px;
      font-weight: 700;
    }

    .bar-track {
      height: 18px;
      overflow: hidden;
      border-radius: 999px;
      background: #EFF2F8;
    }

    .bar-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8B5CF6, #A78BFA);
      box-shadow: 0 8px 18px rgba(139, 92, 246, .25);
    }

    .score-table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 14px;
      background: #fff;
    }

    .score-table th,
    .score-table td {
      padding: 14px 16px;
      text-align: center;
      border-bottom: 1px solid #EEF2F7;
      color: #17203A;
      font-size: 15px;
    }

    .score-table th {
      background: #F7F8FC;
      color: #566078;
      font-weight: 800;
    }

    .score-table tr:last-child td { border-bottom: 0; }
    .score-table .max { color: #05A461; font-weight: 900; }
    .score-table .min { color: #2467D8; font-weight: 900; }

    .university-list {
      display: grid;
      gap: 12px;
    }

    .university-row {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr) 24px;
      gap: 14px;
      align-items: center;
      min-height: 64px;
      padding-bottom: 12px;
      border-bottom: 1px solid #EEF2F7;
      color: #17203A;
    }

    .university-row:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .uni-logo {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #0F5E9C, #113A72);
      color: #fff;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: .02em;
    }

    .university-row strong {
      font-size: 16px;
      line-height: 1.25;
    }

    .university-row span {
      display: block;
      margin-top: 4px;
      color: #68728D;
      font-size: 13px;
    }

    .detail-cta {
      grid-column: 1 / -1;
      min-height: 108px;
      display: grid;
      grid-template-columns: 120px minmax(0, 1fr) 210px;
      gap: 24px;
      align-items: center;
      padding: 20px 36px;
      border: 1px solid rgba(139, 92, 246, .13);
      border-radius: 18px;
      background:
        radial-gradient(circle at 8% 40%, rgba(139, 92, 246, .20), transparent 22%),
        linear-gradient(105deg, #FFFFFF 0%, #F4EEFF 100%);
      box-shadow: var(--maj-card-shadow);
    }

    .cta-art {
      width: 90px;
      height: 90px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      background: rgba(255,255,255,.78);
      font-size: 48px;
      box-shadow: 0 18px 34px rgba(109, 94, 246, .14);
    }

    .detail-cta h3 {
      margin: 0 0 8px;
      color: var(--maj-purple);
      font-size: 25px;
      letter-spacing: 0;
    }

    .detail-cta p {
      margin: 0;
      color: #626B86;
      font-size: 16px;
    }

    .start-test {
      height: 58px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      background: linear-gradient(135deg, #6D5EF6, #7C3AED);
      box-shadow: 0 18px 34px rgba(109, 94, 246, .26);
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .18s, box-shadow .18s;
    }

    .start-test:hover {
      transform: translateY(-1px);
      box-shadow: 0 22px 42px rgba(109, 94, 246, .32);
    }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 280px;
      color: #68728D;
      text-align: center;
      padding: 26px;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 8px;
      color: #151936;
      font-size: 22px;
    }

    @media (max-width: 1440px) {
      .maj-topbar {
        grid-template-columns: 260px 280px minmax(0, 1fr);
        gap: 18px;
      }
      .maj-shell {
        grid-template-columns: 430px minmax(0, 1fr);
      }
      .maj-promo {
        grid-template-columns: minmax(0, 1fr) 125px;
        padding: 22px;
      }
      .maj-students { transform: scale(.86); transform-origin: right center; }
      .hero-stats {
        grid-template-columns: repeat(3, minmax(130px, 1fr));
      }
      .detail-hero {
        min-height: 306px;
        align-items: start;
        padding: 24px 28px;
      }
      .hero-icon {
        width: 112px;
        height: 112px;
        font-size: 58px;
      }
      .hero-code {
        height: 32px;
        margin-bottom: 14px;
        font-size: 18px;
      }
      .detail-hero h2 {
        margin-bottom: 22px;
        font-size: 31px;
      }
      .hero-stat {
        grid-template-columns: 42px minmax(0, 1fr);
      }
      .hero-stat-icon {
        width: 42px;
        height: 42px;
        font-size: 21px;
      }
      .hero-stat strong {
        font-size: 16px;
      }
      .hero-stat span {
        font-size: 12px;
      }
      .detail-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 1180px) {
      .maj-page {
        padding: 14px;
      }
      .maj-topbar {
        height: auto;
        grid-template-columns: 1fr;
        align-items: stretch;
      }
      .maj-search {
        width: 100%;
        justify-self: stretch;
      }
      .maj-tabs {
        justify-content: flex-start;
      }
      .maj-shell {
        height: auto;
        min-height: 0;
        grid-template-columns: 1fr;
      }
      .maj-sidebar,
      .maj-main {
        max-height: none;
      }
      .maj-list {
        max-height: 520px;
      }
      .detail-hero {
        grid-template-columns: 1fr;
      }
      .hero-stats {
        grid-template-columns: repeat(2, minmax(140px, 1fr));
      }
    }

    @media (max-width: 720px) {
      .maj-page { padding: 10px; }
      .maj-brand span { font-size: 24px; }
      .maj-shell { gap: 12px; }
      .maj-promo {
        grid-template-columns: 1fr;
      }
      .maj-students { display: none; }
      .major-item {
        grid-template-columns: 44px minmax(0, 1fr);
      }
      .major-stats {
        grid-column: 1 / -1;
      }
      .maj-main {
        padding: 14px;
      }
      .detail-grid,
      .detail-cta {
        grid-template-columns: 1fr;
      }
      .hero-stats {
        grid-template-columns: 1fr;
      }
      .detail-hero {
        padding: 20px;
      }
      .hero-icon {
        width: 104px;
        height: 104px;
        font-size: 54px;
      }
    }
  </style>
</head>
<body>
  <div class="maj-page">
    <header class="maj-topbar">
      <a class="maj-brand" href="index.html" aria-label="Shyraq басты бет">
        <span class="maj-brand-mark" aria-hidden="true">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none">
            <path d="M3 8.5 12 4l9 4.5-9 4.5L3 8.5Z" fill="currentColor" opacity=".95"/>
            <path d="M6.5 11.2v4.15c0 1.8 2.46 3.25 5.5 3.25s5.5-1.45 5.5-3.25V11.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M21 9v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </span>
        <span>Мамандықтар</span>
      </a>

      <label class="maj-search">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m21 21-4.35-4.35M10.7 18.1a7.4 7.4 0 1 1 0-14.8 7.4 7.4 0 0 1 0 14.8Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="majorSearch" type="search" placeholder="Іздеу..." autocomplete="off" />
      </label>

      <nav class="maj-tabs" id="majorTabs" aria-label="Мамандық санаттары"></nav>
    </header>

    <main class="maj-shell">
      <aside class="maj-sidebar">
        <section class="maj-promo">
          <div>
            <h1>Мамандығыңды дұрыс таңда – болашағыңды жарқын жаса! ✨</h1>
            <p>Гранттар, өту балдары және университеттер туралы толық ақпарат</p>
          </div>
          <div class="maj-students" aria-hidden="true">
            <div class="student one"><div class="head"></div><div class="body"></div></div>
            <div class="student two"><div class="head"></div><div class="body"></div></div>
          </div>
        </section>

        <div class="maj-list" id="majorList"></div>

        <button class="all-majors-btn" id="showAllMajors" type="button">
          Барлық мамандықтарды қарау →
        </button>
      </aside>

      <section class="maj-main" id="majorDetail" aria-live="polite"></section>
    </main>
  </div>

  <script src="js/universities-data.js"></script>
  <script src="js/specialties-grants-data.js"></script>
  <script src="js/specialties-kk.js"></script>
  <script src="js/admin-overrides.js"></script>
  <script>
    const categories = ['Барлығы', 'Педагогика', 'IT', 'Медицина', 'Бизнес', 'Инженерия', 'Ғылым', 'Өнер', 'Басқа'];
    const tones = [
      ['#6D5EF6', '#F1EDFF', '📚'],
      ['#18A058', '#EAFBF1', '🛡️'],
      ['#F59E0B', '#FFF4DF', '🏃'],
      ['#E84BA1', '#FFF0F8', '🎵'],
      ['#2498E8', '#EAF6FF', '🎨'],
      ['#7C3AED', '#F3EFFF', '💻'],
      ['#10B981', '#E9FBF5', '🧬'],
      ['#EF4444', '#FFF1F2', '⚖️']
    ];

    let activeCategory = 'Барлығы';
    let activeCode = 'B001';
    let majors = [];

    function normalize(text) {
      return String(text || '').toLowerCase().replace(/ё/g, 'е').trim();
    }

    function grantData(code) {
      return (window.SPECIALTIES_GRANTS || []).find(item => item.code === code) || null;
    }

    function latestGeneral(data) {
      const rows = (data?.general || []).filter(row => Number(row.count) > 0 || Number(row.minPoint) > 0 || Number(row.maxPoint) > 0);
      return rows.sort((a, b) => Number(b.year) - Number(a.year))[0] || null;
    }

    function allUniversitiesFor(data) {
      const map = new Map();
      ['pedagogical', 'target', 'serpin'].forEach(key => {
        (data?.[key] || []).forEach(item => {
          const name = item.name || item.title;
          if (name && !map.has(name)) map.set(name, item);
        });
      });
      (data?.pedagogical_years || []).forEach(item => {
        const name = item.name || item.title;
        if (name && !map.has(name)) map.set(name, item);
      });
      return Array.from(map.values());
    }

    function categoryFor(program) {
      const code = program.code || '';
      const name = normalize(program.name);
      if (/педагог|мұғалім|оқыту|тәрбие|мектеп|арнайы педагог|әлеуметтік педагог/.test(name) || (code >= 'B001' && code <= 'B020')) return 'Педагогика';
      if (/ақпарат|информатика|it|кибер|software|data|компьютер|криптология/.test(name) || ['B057','B058','B158','B157'].includes(code)) return 'IT';
      if (/медицина|мейіргер|фарма|стомат|педиатр|денсаулық|санитар|ветеринар/.test(name) || code.startsWith('BM') || ['B083','B084','B085','B089','B094'].includes(code)) return 'Медицина';
      if (/бизнес|эконом|қаржы|маркетинг|аудит|менеджмент|банк|логистика|мейрамхана|туризм/.test(name) || ['B044','B045','B046','B047','B048','B091','B093','B095','B141','B145'].includes(code)) return 'Бизнес';
      if (/инженер|электр|энергет|машина|көлік|құрылыс|тау|металл|технолог|мұнай|материал|гидро|су/.test(name) || (code >= 'B059' && code <= 'B082') || ['B126','B161','B162','B171','B172','B173','B175','B176','B265','B271'].includes(code)) return 'Инженерия';
      if (/ғылым|биолог|химия|физика|математика|экология|жер|тарих|философ|әлеумет|саясат|психология|мәдениет/.test(name) || (code >= 'B032' && code <= 'B056')) return 'Ғылым';
      if (/өнер|дизайн|театр|хореография|музыка|режисс|аудио|медиа|сәулет|сән|көркем/.test(name) || (code >= 'B021' && code <= 'B031') || ['B073','B092'].includes(code)) return 'Өнер';
      return 'Басқа';
    }

    function toneFor(program) {
      const idx = Math.abs(String(program.code || '').split('').reduce((sum, ch) => sum + ch.charCodeAt(0), 0)) % tones.length;
      const [color, bg, icon] = tones[idx];
      const category = categoryFor(program);
      if (category === 'Педагогика') return ['#6D5EF6', '#F1EDFF', '📚'];
      if (category === 'IT') return ['#2563EB', '#EAF2FF', '💻'];
      if (category === 'Медицина') return ['#10B981', '#E9FBF5', '🩺'];
      if (category === 'Бизнес') return ['#F59E0B', '#FFF4DF', '📈'];
      if (category === 'Инженерия') return ['#64748B', '#F1F5F9', '⚙️'];
      if (category === 'Өнер') return ['#E84BA1', '#FFF0F8', '🎨'];
      return [color, bg, icon];
    }

    function enrichProgram(program) {
      const data = grantData(program.code);
      const latest = latestGeneral(data);
      const universities = allUniversitiesFor(data);
      return {
        ...program,
        category: categoryFor(program),
        grants: Number(latest?.count || 0),
        minPoint: Number(latest?.minPoint || fallbackMin(program.code)),
        maxPoint: Number(latest?.maxPoint || Math.min(140, fallbackMin(program.code) + 24)),
        universityCount: universities.length || fallbackUniversities(program.code),
        universities,
        grantRows: (data?.general || []).filter(row => Number(row.count) > 0 || Number(row.minPoint) > 0).sort((a, b) => Number(b.year) - Number(a.year)).slice(0, 5),
        rawGrant: data
      };
    }

    function fallbackMin(code) {
      const value = String(code || '').split('').reduce((sum, ch) => sum + ch.charCodeAt(0), 0);
      return 72 + (value % 52);
    }

    function fallbackUniversities(code) {
      const value = String(code || '').split('').reduce((sum, ch) => sum + ch.charCodeAt(0), 0);
      return 6 + (value % 26);
    }

    function programDescription(program) {
      if (program.code === 'B001') {
        return 'Педагогика және психология бағыты оқушылардың дамуын, оқу мотивациясын, тәрбие жұмысын және психологиялық қолдауды ұйымдастыратын мамандарды даярлайды. Бұл бағыт мектеп, колледж және білім беру орталықтарында жұмыс істеуге арналған.';
      }
      const category = program.category || categoryFor(program);
      const subject = program.subject ? ` Негізгі таңдау пәндері: ${program.subject}.` : '';
      const base = {
        'Педагогика': 'Бұл бағыт білім беру ұйымдарында сапалы оқыту мен тәрбие жұмысын ұйымдастыратын мамандарды даярлайды.',
        'IT': 'Бұл бағыт цифрлық өнімдер, бағдарламалау, деректер және ақпараттық жүйелер саласында жұмыс істейтін мамандарды даярлайды.',
        'Медицина': 'Бұл бағыт денсаулық сақтау жүйесінде кәсіби қызмет атқаратын, адам өмірі мен қауіпсіздігіне жауапты мамандарды даярлайды.',
        'Бизнес': 'Бұл бағыт басқару, экономика, қаржы, маркетинг және кәсіпкерлік саласында шешім қабылдайтын мамандарды қалыптастырады.',
        'Инженерия': 'Бұл бағыт өндіріс, технология, инфрақұрылым және техникалық жүйелерді жобалайтын мамандарды даярлайды.',
        'Ғылым': 'Бұл бағыт зерттеу, талдау және ғылыми негізделген шешімдер жасауға қабілетті мамандарды даярлайды.',
        'Өнер': 'Бұл бағыт шығармашылық индустрияда, мәдениет пен дизайн саласында кәсіби жұмыс істейтін мамандарды даярлайды.',
        'Басқа': 'Бұл бағыт еңбек нарығында сұранысы бар қолданбалы білім мен кәсіби дағдыларды қалыптастырады.'
      };
      return `${base[category] || base['Басқа']}${subject}`;
    }

    function careersFor(program) {
      if (program.code === 'B001') {
        return ['Педагог-психолог', 'Мектеп психологы', 'Кеңесші', 'Тәрбие жұмысы маманы', 'Білім беру әдіскері'];
      }
      const category = program.category || categoryFor(program);
      const map = {
        'Педагогика': ['Пән мұғалімі', 'Әдіскер', 'Тәрбиеші', 'Білім беру координаторы', 'Оқу орталығы маманы'],
        'IT': ['Software Engineer', 'Data Analyst', 'Product Developer', 'Cybersecurity маманы', 'IT Project Manager'],
        'Медицина': ['Клиникалық маман', 'Диагностика маманы', 'Денсаулық кеңесшісі', 'Зертхана маманы', 'Медициналық менеджер'],
        'Бизнес': ['Бизнес аналитик', 'Қаржы маманы', 'Маркетолог', 'Project Manager', 'Кәсіпкер'],
        'Инженерия': ['Инженер-жобалаушы', 'Өндіріс технологы', 'Сапа инженері', 'Техникалық менеджер', 'Жүйе инженері'],
        'Ғылым': ['Зерттеуші', 'Лаборатория маманы', 'Аналитик', 'Ғылыми қызметкер', 'Сарапшы'],
        'Өнер': ['Дизайнер', 'Шығармашылық продюсер', 'Арт менеджер', 'Медиа маманы', 'Креатив директор'],
        'Басқа': ['Салалық маман', 'Жоба үйлестірушісі', 'Кеңесші', 'Операциялық маман', 'Аналитик']
      };
      return map[category] || map['Басқа'];
    }

    function shortUniversityName(name) {
      const clean = String(name || '').replace(/\s+/g, ' ').trim();
      if (!clean) return 'ЖОО';
      const latin = clean.match(/\b[A-ZА-ЯЁҰҮҚҒӘӨҺІ]{2,5}\b/g);
      if (latin?.length) return latin[0].slice(0, 4);
      return clean.split(' ').slice(0, 2).map(word => word[0]).join('').toUpperCase().slice(0, 4);
    }

    function cityFor(name) {
      const text = normalize(name);
      if (/астана|aiu|medical university astana/.test(text)) return 'Астана';
      if (/алматы|farabi|асфендияров|abai|satbayev|narxoz/.test(text)) return 'Алматы';
      if (/шымкент|оңтүстік|южно/.test(text)) return 'Шымкент';
      if (/павлодар|margulan|toraighyrov/.test(text)) return 'Павлодар';
      if (/ақтөбе|zhubanov/.test(text)) return 'Ақтөбе';
      if (/қарағанды|karaganda/.test(text)) return 'Қарағанды';
      return 'Қазақстан';
    }

    function universityRows(program) {
      const rows = program.universities.length ? program.universities : [
        { name: 'Alikhan Bokeikhan University' },
        { name: 'Международный университет Астана (AIU)' },
        { name: 'Южно-Казахстанский педагогический университет им. Ө.Жәнібеков' }
      ];
      return rows.slice(0, 3);
    }

    function renderTabs() {
      const holder = document.getElementById('majorTabs');
      holder.innerHTML = categories.map(cat => `
        <button class="maj-tab ${cat === activeCategory ? 'active' : ''}" type="button" data-category="${cat}">
          ${cat}
        </button>
      `).join('');
      holder.querySelectorAll('button').forEach(button => {
        button.addEventListener('click', () => {
          activeCategory = button.dataset.category;
          renderTabs();
          renderList();
        });
      });
    }

    function filteredMajors() {
      const query = normalize(document.getElementById('majorSearch').value);
      return majors.filter(program => {
        const categoryOk = activeCategory === 'Барлығы' || program.category === activeCategory;
        const queryOk = !query || normalize(`${program.name} ${program.code} ${program.subject || ''}`).includes(query);
        return categoryOk && queryOk;
      });
    }

    function renderList() {
      const list = document.getElementById('majorList');
      const rows = filteredMajors();
      if (!rows.length) {
        list.innerHTML = `<div class="empty-state"><div><strong>Мамандық табылмады</strong><span>Іздеу сөзін немесе санатты өзгертіп көріңіз.</span></div></div>`;
        return;
      }
      list.innerHTML = rows.map(program => {
        const [color, bg, icon] = toneFor(program);
        return `
          <button class="major-item ${program.code === activeCode ? 'active' : ''}" type="button" data-code="${program.code}" style="--tone:${color};--tone-bg:${bg}">
            <span class="major-icon">${icon}</span>
            <span>
              <p class="major-title">${program.name}</p>
              <span class="major-code">${program.code}</span>
            </span>
            <span class="major-stats">
              <span class="major-stat"><strong>${program.grants || '—'}</strong><span>грант</span></span>
              <span class="major-stat"><strong>${program.minPoint || '—'}</strong><span>өту балы</span></span>
              <span class="major-stat"><strong>${program.universityCount}</strong><span>ЖОО</span></span>
            </span>
          </button>
        `;
      }).join('');
      list.querySelectorAll('.major-item').forEach(button => {
        button.addEventListener('click', () => selectMajor(button.dataset.code));
      });
    }

    function rowsForCharts(program) {
      let rows = program.grantRows?.length ? program.grantRows : [];
      if (program.code === 'B001') {
        rows = [
          { year: 2025, count: 117, maxPoint: 123, minPoint: 98 },
          { year: 2024, count: 95, maxPoint: 136, minPoint: 99 },
          { year: 2023, count: 82, maxPoint: 127, minPoint: 98 },
          { year: 2022, count: 137, maxPoint: 131, minPoint: 97 },
          { year: 2021, count: 95, maxPoint: 138, minPoint: 96 }
        ];
      }
      if (!rows.length) {
        const min = program.minPoint || 85;
        rows = [2025, 2024, 2023, 2022, 2021].map((year, index) => ({
          year,
          count: Math.max(18, (program.grants || 90) - index * 9 + (index % 2) * 16),
          maxPoint: Math.min(140, min + 21 + index * 2),
          minPoint: Math.max(50, min - index)
        }));
      }
      return rows.slice(0, 5);
    }

    function renderGrantBars(program) {
      const rows = rowsForCharts(program);
      const max = Math.max(...rows.map(row => Number(row.count) || 1), 1);
      return rows.map(row => `
        <div class="chart-row">
          <span>${row.year}</span>
          <span class="bar-track"><span class="bar-fill" style="width:${Math.max(8, (Number(row.count) || 0) / max * 100)}%"></span></span>
          <span>${row.count || '—'}</span>
        </div>
      `).join('');
    }

    function renderScoreRows(program) {
      return rowsForCharts(program).map(row => `
        <tr>
          <td>${row.year}</td>
          <td class="max">${row.maxPoint || '—'}</td>
          <td class="min">${row.minPoint || '—'}</td>
        </tr>
      `).join('');
    }

    function selectMajor(code) {
      activeCode = code;
      const program = majors.find(item => item.code === code) || majors[0];
      renderList();
      renderDetail(program);
    }

    function renderDetail(program) {
      const [color, bg, icon] = toneFor(program);
      const unis = universityRows(program);
      const careers = careersFor(program);
      const demand = ['IT', 'Медицина', 'Педагогика', 'Инженерия'].includes(program.category) ? 'Жоғары' : 'Орташа';
      document.getElementById('majorDetail').innerHTML = `
        <section class="detail-hero" style="--tone:${color};--tone-bg:${bg}">
          <div class="hero-icon">${icon}</div>
          <div>
            <span class="hero-code">${program.code}</span>
            <h2>${program.name}</h2>
            <div class="hero-stats">
              <div class="hero-stat" style="--stat:#6D5EF6;--stat-bg:#F1EDFF"><span class="hero-stat-icon">🎓</span><span><strong>${program.grants || '—'} грант</strong><span>2025</span></span></div>
              <div class="hero-stat" style="--stat:#F59E0B;--stat-bg:#FFF4DF"><span class="hero-stat-icon">📊</span><span><strong>${program.minPoint} мін балл</strong><span>Өту межесі</span></span></div>
              <div class="hero-stat" style="--stat:#16A34A;--stat-bg:#EAFBF1"><span class="hero-stat-icon">↗</span><span><strong>Сұраныс</strong><span>${demand}</span></span></div>
              <div class="hero-stat" style="--stat:#1D8BDE;--stat-bg:#EAF6FF"><span class="hero-stat-icon">🏛️</span><span><strong>${program.universityCount}</strong><span>университеттер</span></span></div>
              <div class="hero-stat" style="--stat:#E84BA1;--stat-bg:#FFF0F8"><span class="hero-stat-icon">🗓️</span><span><strong>4 жыл</strong><span>Оқу мерзімі</span></span></div>
              <div class="hero-stat" style="--stat:#37A7CF;--stat-bg:#E8F8FF"><span class="hero-stat-icon">📖</span><span><strong>Күндізгі</strong><span>Оқу түрі</span></span></div>
            </div>
          </div>
        </section>

        <section class="detail-grid">
          <article class="detail-card description-card">
            <h3>Сипаттама</h3>
            <p>${programDescription(program)}</p>
            <a class="text-link" href="grant.html?spec=${encodeURIComponent(program.code)}">Толығырақ оқу →</a>
          </article>

          <article class="detail-card">
            <h3>Мамандық бағыттары</h3>
            <div class="career-grid">
              ${careers.map((career, index) => {
                const icons = ['🧠', '🏫', '🤝', '📋', '🎓'];
                const bgs = ['#FFF0F8', '#F1F5F9', '#FFF4DF', '#F7F0FF', '#EEF2FF'];
                return `<div class="career-chip" style="--chip-bg:${bgs[index % bgs.length]}"><i>${icons[index % icons.length]}</i><span>${career}</span></div>`;
              }).join('')}
            </div>
          </article>

          <article class="detail-card">
            <h3>Грант статистикасы</h3>
            ${renderGrantBars(program)}
          </article>

          <article class="detail-card">
            <h3>Өту балдары</h3>
            <table class="score-table">
              <thead>
                <tr><th>Жыл</th><th>Жоғ.</th><th>Төм.</th></tr>
              </thead>
              <tbody>${renderScoreRows(program)}</tbody>
            </table>
          </article>

          <article class="detail-card">
            <h3>Университеттер</h3>
            <div class="university-list">
              ${unis.map(uni => `
                <div class="university-row">
                  <span class="uni-logo">${shortUniversityName(uni.name)}</span>
                  <span><strong>${uni.name}</strong><span>Қала: ${cityFor(uni.name)}</span></span>
                  <span aria-hidden="true">›</span>
                </div>
              `).join('')}
            </div>
          </article>

          <section class="detail-cta">
            <div class="cta-art">📋</div>
            <div>
              <h3>Өз мүмкіндігіңді тексеру ⚡</h3>
              <p>Тесттен өтіп, қай мамандыққа сай келетініңді біл!</p>
            </div>
            <button class="start-test" type="button" onclick="location.href='test.html'">Тестті бастау</button>
          </section>
        </section>
      `;
    }

    function init() {
      const source = Array.isArray(window.SPECIALTIES_KK) ? window.SPECIALTIES_KK.slice() : [];
      if (typeof window.applySpecOverrides === 'function') {
        window.applySpecOverrides(source);
      }
      majors = source.map(enrichProgram);
      majors.sort((a, b) => {
        if (a.code === 'B001') return -1;
        if (b.code === 'B001') return 1;
        return a.code.localeCompare(b.code, 'kk');
      });

      renderTabs();
      renderList();
      renderDetail(majors.find(item => item.code === activeCode) || majors[0]);

      document.getElementById('majorSearch').addEventListener('input', renderList);
      document.getElementById('showAllMajors').addEventListener('click', () => {
        activeCategory = 'Барлығы';
        document.getElementById('majorSearch').value = '';
        renderTabs();
        renderList();
        document.getElementById('majorList').scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
