<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мамандықтар — Shyraq Education</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    @font-face {
      font-family: 'Programme Pan';
      src: url('assets/fonts/Programme-Pan-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Programme Pan';
      src: url('assets/fonts/Programme-Pan-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --maj-ink: #111827;
      --maj-muted: #667085;
      --maj-soft: #F6F7FB;
      --maj-line: #E8ECF5;
      --maj-purple: #6D5EF6;
      --maj-purple-2: #8B5CF6;
      --maj-lavender: #F3EFFF;
      --maj-blue: #2563EB;
      --maj-green: #16A34A;
      --maj-pink: #E84BA1;
      --maj-shadow: 0 22px 60px rgba(31, 41, 55, .08);
      --maj-card-shadow: 0 14px 36px rgba(72, 76, 122, .08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--maj-ink);
      font-family: 'Programme Pan', Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(139, 92, 246, .14), transparent 32%),
        radial-gradient(circle at 88% 6%, rgba(37, 99, 235, .10), transparent 24%),
        linear-gradient(180deg, #FFFFFF 0%, #F8F7FF 42%, #F7F9FC 100%);
      overflow-x: hidden;
    }

    button,
    input {
      font-family: inherit;
    }

    .maj-page {
      width: min(1920px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 20px;
    }

    .maj-topbar {
      position: sticky;
      top: 12px;
      z-index: 40;
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
      padding: 12px 16px;
      border: 1px solid rgba(226, 232, 240, .78);
      border-radius: 22px;
      background: rgba(255, 255, 255, .88);
      box-shadow: 0 18px 48px rgba(31, 41, 55, .08);
      backdrop-filter: blur(18px);
    }

    .maj-brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: #101433;
      text-decoration: none;
      min-width: 0;
    }

    .maj-brand-mark {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 13px;
      background: #fff;
      box-shadow: 0 12px 28px rgba(109, 94, 246, .25);
    }

    .maj-brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 3px;
    }

    .maj-brand span {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .maj-nav-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .maj-nav-links::-webkit-scrollbar { display: none; }

    .maj-nav-link {
      display: inline-flex;
      align-items: center;
      height: 42px;
      padding: 0 16px;
      border: 1px solid transparent;
      border-radius: 999px;
      color: #202743;
      text-decoration: none;
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      transition: color .18s, border-color .18s, background .18s, box-shadow .18s;
    }

    .maj-nav-link:hover {
      color: var(--maj-purple);
      background: rgba(244, 241, 255, .72);
      border-color: rgba(109, 94, 246, .12);
    }

    .maj-nav-link.active {
      color: #fff;
      border-color: rgba(109, 94, 246, .14);
      background: linear-gradient(135deg, #5B4BE8, #7C3AED);
      box-shadow: 0 12px 24px rgba(109, 94, 246, .20);
    }

    /* Бургер — тек мобильде көрінеді */
    .maj-burger {
      display: none;
      width: 44px; height: 44px;
      flex: 0 0 44px;
      align-items: center; justify-content: center;
      border: 1px solid rgba(226, 232, 240, .9);
      border-radius: 13px;
      background: #fff;
      color: #111E42;
      cursor: pointer;
    }
    .maj-burger:active { background: #F4F1FF; }

    .maj-cabinet {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 18px;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, #111E42, #2C217E);
      box-shadow: 0 14px 28px rgba(31, 41, 55, .16);
      text-decoration: none;
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
    }

    .maj-shell {
      display: grid;
      grid-template-columns: 430px minmax(0, 1fr);
      gap: 18px;
      height: calc(100vh - 108px);
      min-height: 820px;
    }

    .maj-sidebar,
    .maj-main {
      border: 1px solid rgba(226, 232, 240, .86);
      background: rgba(255, 255, 255, .78);
      box-shadow: var(--maj-shadow);
      backdrop-filter: blur(18px);
    }

    .maj-sidebar {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 16px;
      padding: 0 0 18px;
      border-radius: 22px;
      min-width: 0;
      overflow: hidden;
    }

    .maj-promo {
      position: relative;
      min-height: 190px;
      margin: 0;
      padding: 24px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 145px;
      gap: 12px;
      align-items: center;
      overflow: hidden;
      color: #fff;
      background:
        radial-gradient(circle at 82% 16%, rgba(255,255,255,.35), transparent 24%),
        linear-gradient(135deg, #5D45D9 0%, #8B5CF6 56%, #A855F7 100%);
    }

    .maj-promo h1 {
      margin: 0 0 12px;
      font-size: 21px;
      line-height: 1.16;
      letter-spacing: 0;
      color: #fff;
      text-shadow: 0 2px 12px rgba(31, 20, 87, .18);
    }

    .maj-promo p {
      margin: 0;
      max-width: 290px;
      color: rgba(255,255,255,.86);
      font-size: 16px;
      line-height: 1.34;
    }

    .promo-photo {
      width: 145px;
      height: 158px;
      align-self: end;
      justify-self: end;
      object-fit: cover;
      object-position: 50% 22%;
      border-radius: 28px;
      box-shadow: 0 22px 38px rgba(31,20,87,.20);
      border: 4px solid rgba(255,255,255,.24);
    }

    .maj-list {
      padding: 0 18px;
      overflow-y: auto;
      min-height: 0;
      scrollbar-width: thin;
      scrollbar-color: rgba(109, 94, 246, .28) transparent;
    }

    .maj-list::-webkit-scrollbar { width: 6px; }
    .maj-list::-webkit-scrollbar-thumb { background: rgba(109, 94, 246, .28); border-radius: 20px; }

    .major-item {
      width: 100%;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 178px;
      gap: 14px;
      align-items: center;
      margin-bottom: 10px;
      padding: 12px;
      border: 1px solid rgba(226, 232, 245, .95);
      border-radius: 15px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.96), rgba(249,250,255,.92));
      color: inherit;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(31, 41, 55, .035);
      transition: transform .18s, border-color .18s, box-shadow .18s, background .18s;
    }

    .major-item:hover {
      transform: translateY(-1px);
      border-color: rgba(109, 94, 246, .35);
      box-shadow: var(--maj-card-shadow);
    }

    .major-item.active {
      border-color: rgba(109, 94, 246, .75);
      background:
        radial-gradient(circle at 8% 20%, rgba(109,94,246,.14), transparent 30%),
        linear-gradient(180deg, rgba(247,244,255,.98), #fff);
      box-shadow: 0 0 0 4px rgba(109, 94, 246, .08), 0 16px 34px rgba(109, 94, 246, .10);
    }

    .major-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      font-size: 23px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.18)),
        var(--tone-bg);
      color: var(--tone);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 10px 18px rgba(109,94,246,.08);
    }

    .major-title {
      margin: 0 0 4px;
      color: #151936;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.22;
    }

    .major-code {
      color: #616B89;
      font-size: 12px;
      font-weight: 700;
    }

    .major-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      text-align: center;
    }

    .major-stat strong {
      display: block;
      color: #111633;
      font-size: 16px;
      line-height: 1;
    }

    .major-stat span {
      display: block;
      margin-top: 4px;
      color: #59627E;
      font-size: 11px;
      line-height: 1.05;
    }

    .all-majors-btn {
      height: 58px;
      margin: 0 18px;
      border: 1px solid rgba(109, 94, 246, .32);
      border-radius: 14px;
      color: #33268F;
      background: linear-gradient(180deg, #fff, #F9F7FF);
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      transition: transform .18s, box-shadow .18s;
    }

    .all-majors-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(109, 94, 246, .13);
    }

    .maj-main {
      display: flex;
      flex-direction: column;
      border-radius: 22px;
      padding: 26px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(109, 94, 246, .22) transparent;
    }

    .maj-main::-webkit-scrollbar { width: 7px; }
    .maj-main::-webkit-scrollbar-thumb { background: rgba(109, 94, 246, .22); border-radius: 20px; }

    .detail-hero {
      min-height: 368px;
      display: grid;
      grid-template-columns: 116px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
      padding: 24px 28px 22px;
      border: 1px solid var(--maj-line);
      border-radius: 20px;
      background:
        radial-gradient(circle at 97% 12%, rgba(109,94,246,.08), transparent 32%),
        linear-gradient(180deg, rgba(255,255,255,.94), rgba(251,252,255,.90));
      box-shadow: var(--maj-card-shadow);
    }

    .hero-icon {
      width: 108px;
      height: 108px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      color: var(--tone);
      background:
        linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,255,255,.24)),
        var(--tone-bg);
      font-size: 56px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
    }

    .hero-code {
      display: inline-flex;
      align-items: center;
      height: 36px;
      padding: 0 16px;
      margin-bottom: 14px;
      border-radius: 10px;
      background: #ECEEF7;
      color: #20243D;
      font-size: 20px;
      font-weight: 800;
    }

    .detail-hero h2 {
      margin: 0 0 12px;
      color: #111633;
      font-size: clamp(28px, 2vw, 36px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(180px, 1fr));
      gap: 8px;
      margin-top: -2px;
    }

    .hero-stat {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-height: 50px;
      padding: 7px 10px;
      border: 1px solid rgba(226,232,240,.88);
      border-radius: 14px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.98), rgba(247,249,255,.92));
      box-shadow: 0 12px 24px rgba(31,41,55,.055);
      min-width: 0;
    }

    .hero-stat-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--stat-bg);
      color: var(--stat);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.86);
    }

    .hero-stat-icon svg {
      width: 22px;
      height: 22px;
      display: block;
      stroke: currentColor;
      stroke-width: 2.35;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .hero-stat strong {
      display: block;
      color: #111633;
      font-size: 15px;
      line-height: 1.08;
      word-break: break-word;
    }

    .hero-stat > span:not(.hero-stat-icon) > span {
      display: block;
      margin-top: 3px;
      color: #5A647F;
      font-size: 12px;
      line-height: 1.12;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 16px;
      margin-top: 22px;
    }

    .detail-card {
      min-height: 180px;
      padding: 22px;
      border: 1px solid var(--maj-line);
      border-radius: 18px;
      background: rgba(255,255,255,.88);
      box-shadow: var(--maj-card-shadow);
    }

    .detail-card h3 {
      margin: 0 0 16px;
      color: #121630;
      font-size: 20px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .description-card { grid-column: span 5; }
    .grant-card {
      grid-column: span 3;
      background:
        radial-gradient(circle at 12% 10%, rgba(109,94,246,.13), transparent 30%),
        linear-gradient(180deg, rgba(255,255,255,.96), rgba(250,248,255,.92));
    }
    .score-card { grid-column: span 4; }
    .career-card { grid-column: span 5; }
    .universities-card { grid-column: span 4; }

    .description-card p {
      margin: 0;
      color: #2C344E;
      font-size: 15px;
      line-height: 1.52;
    }

    .text-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
      color: var(--maj-purple);
      font-weight: 800;
      text-decoration: none;
    }

    .career-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px 18px;
    }

    .career-chip {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      min-height: 48px;
      color: #232942;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
    }

    .career-chip i {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--chip-bg);
      font-style: normal;
    }

    .chart-row {
      display: grid;
      grid-template-columns: 50px minmax(0, 1fr) 46px;
      gap: 12px;
      align-items: center;
      margin: 10px 0;
      padding: 9px;
      border: 1px solid rgba(226,232,240,.72);
      border-radius: 14px;
      background: rgba(255,255,255,.72);
      color: #17203A;
      font-size: 15px;
      font-weight: 700;
    }

    .chart-row > span:first-child {
      color: #33268F;
      font-weight: 900;
    }

    .chart-row > span:last-child {
      min-height: 30px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: #fff;
      background: linear-gradient(135deg, #6D5EF6, #8B5CF6);
      box-shadow: 0 10px 20px rgba(109,94,246,.18);
      font-weight: 900;
    }

    .bar-track {
      height: 13px;
      overflow: hidden;
      border-radius: 999px;
      background: #ECEFFD;
    }

    .bar-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8B5CF6, #A78BFA);
      box-shadow: 0 8px 18px rgba(139, 92, 246, .25);
    }

    .score-table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 14px;
      background: #fff;
    }

    .score-table th,
    .score-table td {
      padding: 10px 12px;
      text-align: center;
      border-bottom: 1px solid #EEF2F7;
      color: #17203A;
      font-size: 15px;
    }

    .score-table th {
      background: #F7F8FC;
      color: #566078;
      font-weight: 800;
    }

    .score-table tr:last-child td { border-bottom: 0; }
    .score-table .max { color: #05A461; font-weight: 900; }
    .score-table .min { color: #2467D8; font-weight: 900; }

    .university-list {
      display: grid;
      gap: 10px;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

    .card-head h3 {
      margin: 0;
    }

    .view-all-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid rgba(109,94,246,.22);
      border-radius: 999px;
      background: #F5F2FF;
      color: #5B4BE8;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
      transition: transform .18s, box-shadow .18s, background .18s;
    }

    .view-all-btn:hover {
      transform: translateY(-1px);
      background: #EEE9FF;
      box-shadow: 0 10px 20px rgba(109,94,246,.12);
    }

    .university-list.expanded {
      max-height: 430px;
      overflow-y: auto;
      padding-right: 4px;
      scrollbar-width: thin;
      scrollbar-color: rgba(109,94,246,.30) transparent;
    }

    .university-row {
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr) 20px;
      gap: 12px;
      align-items: center;
      min-height: 54px;
      padding-bottom: 10px;
      border-bottom: 1px solid #EEF2F7;
      color: #17203A;
    }

    .university-row:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .uni-logo {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(135deg, #0F5E9C, #113A72);
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .02em;
    }

    .uni-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
      padding: 6px;
    }

    .university-row strong {
      display: block;
      font-size: 14px;
      line-height: 1.25;
    }

    .university-row span {
      display: block;
      margin-top: 4px;
      color: #68728D;
      font-size: 13px;
    }

    .detail-cta {
      grid-column: span 3;
      min-height: 180px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: center;
      padding: 22px;
      border: 1px solid rgba(139, 92, 246, .13);
      border-radius: 18px;
      background:
        radial-gradient(circle at 8% 40%, rgba(139, 92, 246, .20), transparent 22%),
        linear-gradient(105deg, #FFFFFF 0%, #F4EEFF 100%);
      box-shadow: var(--maj-card-shadow);
    }

    .cta-art {
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      background: rgba(255,255,255,.78);
      font-size: 34px;
      box-shadow: 0 18px 34px rgba(109, 94, 246, .14);
    }

    .detail-cta h3 {
      margin: 0 0 8px;
      color: var(--maj-purple);
      font-size: 21px;
      letter-spacing: 0;
    }

    .detail-cta p {
      margin: 0;
      color: #626B86;
      font-size: 14px;
    }

    .start-test {
      height: 52px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      background: linear-gradient(135deg, #6D5EF6, #7C3AED);
      box-shadow: 0 18px 34px rgba(109, 94, 246, .26);
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .18s, box-shadow .18s;
    }

    .start-test:hover {
      transform: translateY(-1px);
      box-shadow: 0 22px 42px rgba(109, 94, 246, .32);
    }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 280px;
      color: #68728D;
      text-align: center;
      padding: 26px;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 8px;
      color: #151936;
      font-size: 22px;
    }

    @media (max-width: 1440px) {
      .maj-topbar {
        gap: 12px;
      }
      .maj-nav-link {
        padding: 0 12px;
        font-size: 14px;
      }
      .maj-shell {
        grid-template-columns: 390px minmax(0, 1fr);
      }
      .maj-promo {
        grid-template-columns: minmax(0, 1fr) 116px;
        padding: 20px;
      }
      .promo-photo {
        width: 116px;
        height: 138px;
      }
      .hero-stats {
        grid-template-columns: repeat(2, minmax(170px, 1fr));
      }
      .detail-hero {
        min-height: 368px;
        align-items: start;
        padding: 24px 28px;
      }
      .hero-icon {
        width: 112px;
        height: 112px;
        font-size: 58px;
      }
      .hero-code {
        height: 32px;
        margin-bottom: 14px;
        font-size: 18px;
      }
      .detail-hero h2 {
        margin-bottom: 12px;
        font-size: 31px;
      }
      .hero-stat {
        grid-template-columns: 38px minmax(0, 1fr);
      }
      .hero-stat-icon {
        width: 38px;
        height: 38px;
      }
      .hero-stat-icon svg {
        width: 21px;
        height: 21px;
      }
      .hero-stat strong {
        font-size: 14px;
      }
      .hero-stat > span:not(.hero-stat-icon) > span {
        font-size: 12px;
      }
      .detail-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .description-card,
      .grant-card,
      .score-card,
      .career-card,
      .universities-card,
      .detail-cta {
        grid-column: auto;
      }
    }

    @media (max-width: 1180px) {
      .maj-page {
        padding: 14px;
      }
      .maj-topbar {
        height: auto;
        position: static;
        flex-wrap: wrap;
        align-items: center;
      }
      .maj-burger { display: inline-flex; order: 2; }
      .maj-cabinet { order: 1; }
      /* Мобильде мәзір бургермен ашылады */
      .maj-nav-links {
        order: 3;
        flex-basis: 100%;
        display: none;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        overflow: visible;
        margin-top: 4px;
        padding-top: 12px;
        border-top: 1px solid rgba(226, 232, 240, .8);
      }
      .maj-topbar.nav-open .maj-nav-links { display: flex; }
      .maj-nav-link { height: 46px; padding: 0 16px; width: 100%; }
      .maj-shell {
        height: auto;
        min-height: 0;
        grid-template-columns: 1fr;
      }
      .maj-sidebar,
      .maj-main {
        max-height: none;
      }
      .maj-list {
        max-height: 520px;
      }
      .detail-hero {
        grid-template-columns: 1fr;
      }
      .hero-stats {
        grid-template-columns: repeat(2, minmax(140px, 1fr));
      }
    }

    @media (max-width: 720px) {
      .maj-page { padding: 10px; }
      .maj-brand span { font-size: 24px; }
      .maj-topbar {
        border-radius: 18px;
        padding: 10px;
      }
      .maj-cabinet {
        min-height: 38px;
        padding: 0 14px;
      }
      .maj-shell { gap: 12px; }
      .maj-promo {
        grid-template-columns: minmax(0, 1fr) 112px;
      }
      .promo-photo {
        width: 112px;
        height: 136px;
        border-radius: 22px;
      }
      .major-item {
        grid-template-columns: 44px minmax(0, 1fr);
      }
      .major-stats {
        grid-column: 1 / -1;
      }
      .maj-main {
        padding: 14px;
      }
      .detail-grid,
      .detail-cta {
        grid-template-columns: 1fr;
      }
      .hero-stats {
        grid-template-columns: 1fr;
      }
      .detail-hero {
        padding: 20px;
      }
      .hero-icon {
        width: 104px;
        height: 104px;
        font-size: 54px;
      }
    }
  </style>
</head>

  <script src="js/universities-data.js"></script>
  <script src="js/specialties-grants-data.js"></script>
  <script src="js/specialties-kk.js"></script>
  <script src="js/admin-overrides.js"></script>
  <script>
    const tones = [
      ['#6D5EF6', '#F1EDFF', '📚'],
      ['#18A058', '#EAFBF1', '🛡️'],
      ['#F59E0B', '#FFF4DF', '🏃'],
      ['#E84BA1', '#FFF0F8', '🎵'],
      ['#2498E8', '#EAF6FF', '🎨'],
      ['#7C3AED', '#F3EFFF', '💻'],
      ['#10B981', '#E9FBF5', '🧬'],
      ['#EF4444', '#FFF1F2', '⚖️']
    ];

    let activeCode = 'B001';
    let majors = [];
    const expandedUniversityCodes = new Set();

    function normalize(text) {
      return String(text || '').toLowerCase().replace(/ё/g, 'е').trim();
    }

    function grantData(code) {
      return (window.SPECIALTIES_GRANTS || []).find(item => item.code === code) || null;
    }

    function latestGeneral(data) {
      const rows = (data?.general || []).filter(row => Number(row.count) > 0 || Number(row.minPoint) > 0 || Number(row.maxPoint) > 0);
      return rows.sort((a, b) => Number(b.year) - Number(a.year))[0] || null;
    }

    function universitySeed() {
      return Array.isArray(window.UNIVERSITIES_SEED) ? window.UNIVERSITIES_SEED : [];
    }

    function universityDisplayName(uni) {
      return uni?.name || uni?.title || uni?.name_kz || uni?.name_ru || uni?.name_en || uni?.short_name || 'Университет';
    }

    function seedForUniversity(item) {
      const code = String(item?.code || '').padStart(3, '0');
      const name = normalize(universityDisplayName(item));
      return universitySeed().find(uni => String(uni.code || '').padStart(3, '0') === code)
        || universitySeed().find(uni => {
          const names = [uni.name_kz, uni.name_ru, uni.name_en, uni.short_name].map(normalize).filter(Boolean);
          return names.some(candidate => candidate === name || candidate.includes(name) || name.includes(candidate));
        })
        || null;
    }

    function enrichUniversity(item) {
      const seed = seedForUniversity(item);
      return {
        ...seed,
        ...item,
        code: item?.code || seed?.code,
        name: universityDisplayName(item),
        logo_url: item?.logo_url || seed?.logo_url,
        city: item?.city || seed?.city
      };
    }

    function allUniversitiesFor(data) {
      const map = new Map();
      ['pedagogical', 'target', 'serpin'].forEach(key => {
        (data?.[key] || []).forEach(item => {
          const name = item.name || item.title;
          if (name && !map.has(name)) map.set(name, item);
        });
      });
      (data?.pedagogical_years || []).forEach(item => {
        const name = item.name || item.title;
        if (name && !map.has(name)) map.set(name, item);
      });
      return Array.from(map.values()).map(enrichUniversity);
    }

    function categoryFor(program) {
      const code = program.code || '';
      const name = normalize(program.name);
      if (/педагог|мұғалім|оқыту|тәрбие|мектеп|арнайы педагог|әлеуметтік педагог/.test(name) || (code >= 'B001' && code <= 'B020')) return 'Педагогика';
      if (/ақпарат|информатика|it|кибер|software|data|компьютер|криптология/.test(name) || ['B057','B058','B158','B157'].includes(code)) return 'IT';
      if (/медицина|мейіргер|фарма|стомат|педиатр|денсаулық|санитар|ветеринар/.test(name) || code.startsWith('BM') || ['B083','B084','B085','B089','B094'].includes(code)) return 'Медицина';
      if (/бизнес|эконом|қаржы|маркетинг|аудит|менеджмент|банк|логистика|мейрамхана|туризм/.test(name) || ['B044','B045','B046','B047','B048','B091','B093','B095','B141','B145'].includes(code)) return 'Бизнес';
      if (/инженер|электр|энергет|машина|көлік|құрылыс|тау|металл|технолог|мұнай|материал|гидро|су/.test(name) || (code >= 'B059' && code <= 'B082') || ['B126','B161','B162','B171','B172','B173','B175','B176','B265','B271'].includes(code)) return 'Инженерия';
      if (/ғылым|биолог|химия|физика|математика|экология|жер|тарих|философ|әлеумет|саясат|психология|мәдениет/.test(name) || (code >= 'B032' && code <= 'B056')) return 'Ғылым';
      if (/өнер|дизайн|театр|хореография|музыка|режисс|аудио|медиа|сәулет|сән|көркем/.test(name) || (code >= 'B021' && code <= 'B031') || ['B073','B092'].includes(code)) return 'Өнер';
      return 'Басқа';
    }

    function toneFor(program) {
      const idx = Math.abs(String(program.code || '').split('').reduce((sum, ch) => sum + ch.charCodeAt(0), 0)) % tones.length;
      const [color, bg, icon] = tones[idx];
      const category = categoryFor(program);
      if (category === 'Педагогика') return ['#6D5EF6', '#F1EDFF', '📚'];
      if (category === 'IT') return ['#2563EB', '#EAF2FF', '💻'];
      if (category === 'Медицина') return ['#10B981', '#E9FBF5', '🩺'];
      if (category === 'Бизнес') return ['#F59E0B', '#FFF4DF', '📈'];
      if (category === 'Инженерия') return ['#64748B', '#F1F5F9', '⚙️'];
      if (category === 'Өнер') return ['#E84BA1', '#FFF0F8', '🎨'];
      return [color, bg, icon];
    }

    function enrichProgram(program) {
      const data = grantData(program.code);
      const latest = latestGeneral(data);
      const universities = allUniversitiesFor(data);
      return {
        ...program,
        category: categoryFor(program),
        grants: Number(latest?.count || 0),
        minPoint: Number(latest?.minPoint || fallbackMin(program.code)),
        maxPoint: Number(latest?.maxPoint || Math.min(140, fallbackMin(program.code) + 24)),
        universityCount: universities.length || fallbackUniversities(program.code),
        universities,
        grantRows: (data?.general || []).filter(row => Number(row.count) > 0 || Number(row.minPoint) > 0).sort((a, b) => Number(b.year) - Number(a.year)).slice(0, 5),
        rawGrant: data
      };
    }

    function fallbackMin(code) {
      const value = String(code || '').split('').reduce((sum, ch) => sum + ch.charCodeAt(0), 0);
      return 72 + (value % 52);
    }

    function fallbackUniversities(code) {
      const value = String(code || '').split('').reduce((sum, ch) => sum + ch.charCodeAt(0), 0);
      return 6 + (value % 26);
    }

    function programDescription(program) {
      if (program.code === 'B001') {
        return 'Педагогика және психология бағыты оқушылардың дамуын, оқу мотивациясын, тәрбие жұмысын және психологиялық қолдауды ұйымдастыратын мамандарды даярлайды. Бұл бағыт мектеп, колледж және білім беру орталықтарында жұмыс істеуге арналған.';
      }
      const category = program.category || categoryFor(program);
      const subject = program.subject ? ` Негізгі таңдау пәндері: ${program.subject}.` : '';
      const base = {
        'Педагогика': 'Бұл бағыт білім беру ұйымдарында сапалы оқыту мен тәрбие жұмысын ұйымдастыратын мамандарды даярлайды.',
        'IT': 'Бұл бағыт цифрлық өнімдер, бағдарламалау, деректер және ақпараттық жүйелер саласында жұмыс істейтін мамандарды даярлайды.',
        'Медицина': 'Бұл бағыт денсаулық сақтау жүйесінде кәсіби қызмет атқаратын, адам өмірі мен қауіпсіздігіне жауапты мамандарды даярлайды.',
        'Бизнес': 'Бұл бағыт басқару, экономика, қаржы, маркетинг және кәсіпкерлік саласында шешім қабылдайтын мамандарды қалыптастырады.',
        'Инженерия': 'Бұл бағыт өндіріс, технология, инфрақұрылым және техникалық жүйелерді жобалайтын мамандарды даярлайды.',
        'Ғылым': 'Бұл бағыт зерттеу, талдау және ғылыми негізделген шешімдер жасауға қабілетті мамандарды даярлайды.',
        'Өнер': 'Бұл бағыт шығармашылық индустрияда, мәдениет пен дизайн саласында кәсіби жұмыс істейтін мамандарды даярлайды.',
        'Басқа': 'Бұл бағыт еңбек нарығында сұранысы бар қолданбалы білім мен кәсіби дағдыларды қалыптастырады.'
      };
      return `${base[category] || base['Басқа']}${subject}`;
    }

    function careersFor(program) {
      if (program.code === 'B001') {
        return ['Педагог-психолог', 'Мектеп психологы', 'Кеңесші', 'Тәрбие жұмысы маманы', 'Білім беру әдіскері'];
      }
      const category = program.category || categoryFor(program);
      const map = {
        'Педагогика': ['Пән мұғалімі', 'Әдіскер', 'Тәрбиеші', 'Білім беру координаторы', 'Оқу орталығы маманы'],
        'IT': ['Software Engineer', 'Data Analyst', 'Product Developer', 'Cybersecurity маманы', 'IT Project Manager'],
        'Медицина': ['Клиникалық маман', 'Диагностика маманы', 'Денсаулық кеңесшісі', 'Зертхана маманы', 'Медициналық менеджер'],
        'Бизнес': ['Бизнес аналитик', 'Қаржы маманы', 'Маркетолог', 'Project Manager', 'Кәсіпкер'],
        'Инженерия': ['Инженер-жобалаушы', 'Өндіріс технологы', 'Сапа инженері', 'Техникалық менеджер', 'Жүйе инженері'],
        'Ғылым': ['Зерттеуші', 'Лаборатория маманы', 'Аналитик', 'Ғылыми қызметкер', 'Сарапшы'],
        'Өнер': ['Дизайнер', 'Шығармашылық продюсер', 'Арт менеджер', 'Медиа маманы', 'Креатив директор'],
        'Басқа': ['Салалық маман', 'Жоба үйлестірушісі', 'Кеңесші', 'Операциялық маман', 'Аналитик']
      };
      return map[category] || map['Басқа'];
    }

    function shortUniversityName(name) {
      const clean = String(name || '').replace(/\s+/g, ' ').trim();
      if (!clean) return 'ЖОО';
      const latin = clean.match(/\b[A-ZА-ЯЁҰҮҚҒӘӨҺІ]{2,5}\b/g);
      if (latin?.length) return latin[0].slice(0, 4);
      return clean.split(' ').slice(0, 2).map(word => word[0]).join('').toUpperCase().slice(0, 4);
    }

    function logoSrcFor(uni) {
      if (uni?.logo_url) return uni.logo_url;
      const map = {
        '141': 'assets/university-logos/kz-141-53.jpg',
        '185': 'assets/university-logos/kz-185-62.jpg',
        '196': 'assets/university-logos/kz-196-64.png',
        '517': 'assets/university-logos/kz-517-70.png',
        '031': 'assets/university-logos/kz-031-27.jpg',
        '003': 'assets/university-logos/kz-003-3.jpg',
        '005': 'assets/university-logos/kz-005-5.jpg',
        '008': 'assets/university-logos/kz-008-7.jpg',
        '010': 'assets/university-logos/kz-010-9.jpg',
        '011': 'assets/university-logos/kz-011-10.jpg'
      };
      return map[String(uni?.code || '').padStart(3, '0')] || '';
    }

    function cityFor(uni) {
      if (typeof uni === 'object' && uni?.city) return uni.city;
      const text = normalize(typeof uni === 'object' ? universityDisplayName(uni) : uni);
      if (/астана|aiu|medical university astana/.test(text)) return 'Астана';
      if (/алматы|farabi|асфендияров|abai|satbayev|narxoz/.test(text)) return 'Алматы';
      if (/шымкент|оңтүстік|южно/.test(text)) return 'Шымкент';
      if (/павлодар|margulan|toraighyrov/.test(text)) return 'Павлодар';
      if (/ақтөбе|zhubanov/.test(text)) return 'Ақтөбе';
      if (/қарағанды|karaganda/.test(text)) return 'Қарағанды';
      return 'Қазақстан';
    }

    function fallbackUniversityRows(program) {
      const category = program.category || categoryFor(program);
      const pool = universitySeed().filter(uni => {
        const text = normalize(`${uni.name_kz || ''} ${uni.name_ru || ''} ${uni.name_en || ''} ${uni.category || ''} ${uni.university_type || ''}`);
        if (category === 'Медицина') return /медицин|medical|денсаулық/.test(text);
        if (category === 'Педагогика') return /педагог|education|университет/.test(text);
        if (category === 'IT') return /aitu|qairu|sdu|satbayev|ақпарат|техник|technical|research/.test(text);
        if (category === 'Инженерия') return /техник|technical|satbayev|энергет|аграр|индустри/.test(text);
        if (category === 'Бизнес') return /narxoz|эконом|business|менеджмент|қаржы|университет/.test(text);
        return /университет|university/.test(text);
      });
      return (pool.length ? pool : universitySeed()).slice(0, 8).map(enrichUniversity);
    }

    function universityRows(program, expanded = false) {
      const rows = program.universities.length ? program.universities : [
        ...fallbackUniversityRows(program)
      ];
      return expanded ? rows : rows.slice(0, 3);
    }

    function renderUniversityRows(program, expanded = false) {
      const rows = universityRows(program, expanded);
      return rows.map(uni => {
        const name = universityDisplayName(uni);
        const logo = logoSrcFor(uni);
        return `
          <div class="university-row">
            <span class="uni-logo">${logo ? `<img src="${logo}" alt="${name} логотипі" />` : shortUniversityName(name)}</span>
            <span><strong>${name}</strong><span>Қала: ${cityFor(uni)}</span></span>
            <span aria-hidden="true">›</span>
          </div>
        `;
      }).join('');
    }

    function toggleUniversities(code) {
      if (expandedUniversityCodes.has(code)) {
        expandedUniversityCodes.delete(code);
      } else {
        expandedUniversityCodes.add(code);
      }
      const program = majors.find(item => item.code === code);
      if (program) renderDetail(program);
    }

    function filteredMajors() {
      const query = normalize(document.getElementById('majorSearch')?.value || '');
      return majors.filter(program => {
        const queryOk = !query || normalize(`${program.name} ${program.code} ${program.subject || ''}`).includes(query);
        return queryOk;
      });
    }

    function renderList() {
      const list = document.getElementById('majorList');
      const rows = filteredMajors();
      if (!rows.length) {
        list.innerHTML = `<div class="empty-state"><div><strong>Мамандық табылмады</strong><span>Іздеу сөзін немесе санатты өзгертіп көріңіз.</span></div></div>`;
        return;
      }
      list.innerHTML = rows.map(program => {
        const [color, bg, icon] = toneFor(program);
        return `
          <button class="major-item ${program.code === activeCode ? 'active' : ''}" type="button" data-code="${program.code}" style="--tone:${color};--tone-bg:${bg}">
            <span class="major-icon">${icon}</span>
            <span>
              <p class="major-title">${program.name}</p>
              <span class="major-code">${program.code}</span>
            </span>
            <span class="major-stats">
              <span class="major-stat"><strong>${program.grants || '—'}</strong><span>грант</span></span>
              <span class="major-stat"><strong>${program.minPoint || '—'}</strong><span>өту балы</span></span>
              <span class="major-stat"><strong>${program.universityCount}</strong><span>ЖОО</span></span>
            </span>
          </button>
        `;
      }).join('');
      list.querySelectorAll('.major-item').forEach(button => {
        button.addEventListener('click', () => selectMajor(button.dataset.code));
      });
    }

    function rowsForCharts(program) {
      let rows = program.grantRows?.length ? program.grantRows : [];
      if (program.code === 'B001') {
        rows = [
          { year: 2025, count: 117, maxPoint: 123, minPoint: 98 },
          { year: 2024, count: 95, maxPoint: 136, minPoint: 99 },
          { year: 2023, count: 82, maxPoint: 127, minPoint: 98 },
          { year: 2022, count: 137, maxPoint: 131, minPoint: 97 },
          { year: 2021, count: 95, maxPoint: 138, minPoint: 96 }
        ];
      }
      if (!rows.length) {
        const min = program.minPoint || 85;
        rows = [2025, 2024, 2023, 2022, 2021].map((year, index) => ({
          year,
          count: Math.max(18, (program.grants || 90) - index * 9 + (index % 2) * 16),
          maxPoint: Math.min(140, min + 21 + index * 2),
          minPoint: Math.max(50, min - index)
        }));
      }
      return rows.slice(0, 5);
    }

    function renderGrantBars(program) {
      const rows = rowsForCharts(program);
      const max = Math.max(...rows.map(row => Number(row.count) || 1), 1);
      return rows.map(row => `
        <div class="chart-row">
          <span>${row.year}</span>
          <span class="bar-track"><span class="bar-fill" style="width:${Math.max(8, (Number(row.count) || 0) / max * 100)}%"></span></span>
          <span>${row.count || '—'}</span>
        </div>
      `).join('');
    }

    function renderScoreRows(program) {
      return rowsForCharts(program).map(row => `
        <tr>
          <td>${row.year}</td>
          <td class="max">${row.maxPoint || '—'}</td>
          <td class="min">${row.minPoint || '—'}</td>
        </tr>
      `).join('');
    }

    function statSvg(type) {
      const icons = {
        grant: '<svg viewBox="0 0 24 24"><path d="M4 10.5 12 6l8 4.5-8 4.5-8-4.5Z"/><path d="M7 13v3c0 1.3 2.2 2.4 5 2.4s5-1.1 5-2.4v-3"/><path d="M20 11v5"/></svg>',
        score: '<svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 16v-5"/><path d="M12 16V8"/><path d="M16 16v-3"/></svg>',
        demand: '<svg viewBox="0 0 24 24"><path d="M4 16l5-5 4 4 7-8"/><path d="M15 7h5v5"/></svg>',
        university: '<svg viewBox="0 0 24 24"><path d="M3 10h18"/><path d="M5 10l7-5 7 5"/><path d="M6 10v8"/><path d="M10 10v8"/><path d="M14 10v8"/><path d="M18 10v8"/><path d="M4 18h16"/></svg>',
        time: '<svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="3"/><path d="M9 2v4"/><path d="M15 2v4"/><path d="M8 10h8"/><path d="M8 14h5"/></svg>',
        study: '<svg viewBox="0 0 24 24"><path d="M5 5.5A3.5 3.5 0 0 1 8.5 2H20v17H8.5A3.5 3.5 0 0 0 5 22V5.5Z"/><path d="M5 5.5A3.5 3.5 0 0 0 1.5 2H1v17h.5A3.5 3.5 0 0 1 5 22"/></svg>'
      };
      return icons[type] || icons.grant;
    }

    function selectMajor(code) {
      activeCode = code;
      const program = majors.find(item => item.code === code) || majors[0];
      renderList();
      renderDetail(program);
    }

    function renderDetail(program) {
      const [color, bg, icon] = toneFor(program);
      const careers = careersFor(program);
      const demand = ['IT', 'Медицина', 'Педагогика', 'Инженерия'].includes(program.category) ? 'Жоғары' : 'Орташа';
      const unisExpanded = expandedUniversityCodes.has(program.code);
      const universityTotal = universityRows(program, true).length;
      document.getElementById('majorDetail').innerHTML = `
        <section class="detail-hero" style="--tone:${color};--tone-bg:${bg}">
          <div class="hero-icon">${icon}</div>
          <div>
            <span class="hero-code">${program.code}</span>
            <h2>${program.name}</h2>
            <div class="hero-stats">
              <div class="hero-stat" style="--stat:#6D5EF6;--stat-bg:#F1EDFF"><span class="hero-stat-icon">${statSvg('grant')}</span><span><strong>${program.grants || '—'} грант</strong><span>2025</span></span></div>
              <div class="hero-stat" style="--stat:#F59E0B;--stat-bg:#FFF4DF"><span class="hero-stat-icon">${statSvg('score')}</span><span><strong>${program.minPoint} мін балл</strong><span>Өту межесі</span></span></div>
              <div class="hero-stat" style="--stat:#16A34A;--stat-bg:#EAFBF1"><span class="hero-stat-icon">${statSvg('demand')}</span><span><strong>Сұраныс</strong><span>${demand}</span></span></div>
              <div class="hero-stat" style="--stat:#1D8BDE;--stat-bg:#EAF6FF"><span class="hero-stat-icon">${statSvg('university')}</span><span><strong>${program.universityCount}</strong><span>университеттер</span></span></div>
              <div class="hero-stat" style="--stat:#E84BA1;--stat-bg:#FFF0F8"><span class="hero-stat-icon">${statSvg('time')}</span><span><strong>4 жыл</strong><span>Оқу мерзімі</span></span></div>
              <div class="hero-stat" style="--stat:#37A7CF;--stat-bg:#E8F8FF"><span class="hero-stat-icon">${statSvg('study')}</span><span><strong>Күндізгі</strong><span>Оқу түрі</span></span></div>
            </div>
          </div>
        </section>

        <section class="detail-grid">
          <article class="detail-card grant-card">
            <h3>Грант статистикасы</h3>
            ${renderGrantBars(program)}
          </article>

          <article class="detail-card score-card">
            <h3>Өту балдары</h3>
            <table class="score-table">
              <thead>
                <tr><th>Жыл</th><th>Жоғ.</th><th>Төм.</th></tr>
              </thead>
              <tbody>${renderScoreRows(program)}</tbody>
            </table>
          </article>

          <article class="detail-card description-card">
            <h3>Сипаттама</h3>
            <p>${programDescription(program)}</p>
            <a class="text-link" href="grant.html?spec=${encodeURIComponent(program.code)}">Толығырақ оқу →</a>
          </article>

          <article class="detail-card career-card">
            <h3>Мамандық бағыттары</h3>
            <div class="career-grid">
              ${careers.map((career, index) => {
                const icons = ['🧠', '🏫', '🤝', '📋', '🎓'];
                const bgs = ['#FFF0F8', '#F1F5F9', '#FFF4DF', '#F7F0FF', '#EEF2FF'];
                return `<div class="career-chip" style="--chip-bg:${bgs[index % bgs.length]}"><i>${icons[index % icons.length]}</i><span>${career}</span></div>`;
              }).join('')}
            </div>
          </article>

          <article class="detail-card universities-card">
            <div class="card-head">
              <h3>Университеттер</h3>
              <button class="view-all-btn" type="button" onclick="toggleUniversities('${program.code}')">
                ${unisExpanded ? 'Жасыру' : `Барлығын көру (${universityTotal})`}
              </button>
            </div>
            <div class="university-list ${unisExpanded ? 'expanded' : ''}">
              ${renderUniversityRows(program, unisExpanded)}
            </div>
          </article>

          <section class="detail-cta">
            <div class="cta-art">📋</div>
            <div>
              <h3>Грант балыңды тексер ⚡</h3>
              <p>Өз ҰБТ балыңмен қай университетке грантқа түсе алатыныңды көр.</p>
            </div>
            <button class="start-test" type="button" onclick="location.href='grant.html?spec=${encodeURIComponent(program.code)}'">Грант баллын көру</button>
          </section>
        </section>
      `;
    }

    function init() {
      const source = Array.isArray(window.SPECIALTIES_KK) ? window.SPECIALTIES_KK.slice() : [];
      if (typeof window.applySpecOverrides === 'function') {
        window.applySpecOverrides(source);
      }
      majors = source.map(enrichProgram);
      majors.sort((a, b) => {
        if (a.code === 'B001') return -1;
        if (b.code === 'B001') return 1;
        return a.code.localeCompare(b.code, 'kk');
      });

      renderList();
      renderDetail(majors.find(item => item.code === activeCode) || majors[0]);

      document.getElementById('majorSearch')?.addEventListener('input', renderList);
      document.getElementById('showAllMajors').addEventListener('click', () => {
        if (document.getElementById('majorSearch')) document.getElementById('majorSearch').value = '';
        renderList();
        document.getElementById('majorList').scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
  <script>
    // Мобиль бургер мәзірі
    (function(){
      var b = document.getElementById('majBurger');
      var bar = document.querySelector('.maj-topbar');
      if(!b || !bar) return;
      b.addEventListener('click', function(){
        var open = bar.classList.toggle('nav-open');
        b.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      // Сілтеме басылса — жабамыз
      bar.querySelectorAll('.maj-nav-link').forEach(function(a){
        a.addEventListener('click', function(){ bar.classList.remove('nav-open'); });
      });
    })();
  </script>
</body>
</html>
