<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мамандықтар — Shyraq Education</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .catalog-icon {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: currentColor;
      flex: 0 0 auto;
    }

    .catalog-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .catalog-icon svg * {
      stroke: currentColor;
      fill: none;
      stroke-width: 2.15;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .tag .catalog-icon {
      width: 16px;
      height: 16px;
      color: var(--navy);
      opacity: .82;
    }

    .tag.active .catalog-icon,
    .filter-chip.active .catalog-icon {
      color: #fff;
      opacity: 1;
    }

    .spec-card-icon,
    .specialty-modal-icon {
      border: 1px solid #E2E8F0;
      background: linear-gradient(180deg, #FFFFFF 0%, #F6FAFF 100%);
      box-shadow: 0 14px 34px rgba(30, 58, 95, .08);
      overflow: hidden;
    }

    .spec-card-icon .catalog-icon {
      width: 26px;
      height: 26px;
      color: var(--navy);
    }

    .specialty-modal-icon {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .specialty-modal-icon .catalog-icon {
      width: 30px;
      height: 30px;
      color: var(--navy);
    }

    .spec-asset-icon {
      width: 42px;
      height: 42px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 10px 16px rgba(30, 58, 95, .14));
    }

    .spec-card-meta .badge,
    .spec-card-actions .btn,
    .specialty-info-label,
    .specialty-modal-actions .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .spec-card-meta .catalog-icon,
    .spec-card-actions .catalog-icon,
    .specialty-info-label .catalog-icon,
    .specialty-modal-actions .catalog-icon {
      width: 14px;
      height: 14px;
    }

    .empty-state-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto;
      border-radius: 16px;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--navy);
    }

    .empty-state-icon .catalog-icon {
      width: 26px;
      height: 26px;
    }

    .majors-shell {
      padding: 42px 0 72px;
    }

    .majors-title {
      color: #111827;
      font-size: clamp(2.2rem, 4vw, 4rem);
      line-height: 1;
      letter-spacing: 0;
      margin: 0 0 44px;
      font-weight: 900;
    }

    .majors-filter-panel {
      background: #fff;
      border: 1px solid #DDE5F0;
      border-radius: 18px;
      padding: 52px 64px 36px;
      box-shadow: 0 0 0 1px rgba(89, 104, 255, .16), 0 20px 54px rgba(30, 58, 95, .07);
      margin-bottom: 28px;
    }

    .majors-filter-head {
      display: grid;
      grid-template-columns: 1fr minmax(260px, 420px);
      align-items: center;
      gap: 24px;
      margin-bottom: 28px;
    }

    .majors-filter-head h2 {
      margin: 0;
      color: #202336;
      font-size: 1.45rem;
      font-weight: 850;
    }

    .subject-select-wrap {
      position: relative;
    }

    .subject-select-wrap .catalog-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      color: var(--navy);
      pointer-events: none;
    }

    .subject-select {
      width: 100%;
      height: 54px;
      border: 1.5px solid #5968FF;
      border-radius: 12px;
      padding: 0 48px 0 50px;
      font-size: 1.02rem;
      font-family: var(--font-body);
      font-weight: 600;
      color: #2D3748;
      background: #fff;
      outline: none;
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, #98A2B3 50%), linear-gradient(135deg, #98A2B3 50%, transparent 50%);
      background-position: calc(100% - 25px) 23px, calc(100% - 18px) 23px;
      background-size: 7px 7px, 7px 7px;
      background-repeat: no-repeat;
    }

    .majors-search-row {
      position: relative;
    }

    .majors-search-row .catalog-icon {
      position: absolute;
      left: 22px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      color: #98A2B3;
      pointer-events: none;
    }

    .majors-search {
      width: 100%;
      height: 58px;
      border: 1.5px solid #CBD5E1;
      border-radius: 12px;
      padding: 0 22px 0 58px;
      font-size: 1rem;
      font-family: var(--font-body);
      color: var(--text);
      outline: none;
      transition: var(--transition);
    }

    .majors-search:focus,
    .subject-select:focus {
      border-color: #5968FF;
      box-shadow: 0 0 0 4px rgba(89, 104, 255, .10);
    }

    .majors-tabs {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 22px;
    }

    .majors-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 28px 0 14px;
    }

    .majors-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .majors-table-head,
    .major-row {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr) 330px;
      gap: 8px;
      align-items: stretch;
    }

    .majors-table-head {
      padding: 0 38px 12px;
      color: #202336;
      font-size: .98rem;
      font-weight: 850;
    }

    .major-row {
      width: 100%;
      background: transparent;
      border: 0;
      padding: 0;
      text-align: left;
      font-family: var(--font-body);
      cursor: pointer;
    }

    .major-cell {
      min-height: 58px;
      display: flex;
      align-items: center;
      background: #fff;
      border: 1.5px solid #D4DAE7;
      border-radius: 10px;
      padding: 0 24px;
      color: #1F3347;
      font-size: 1rem;
      line-height: 1.35;
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .major-code-cell {
      justify-content: center;
      padding: 0 10px;
      font-weight: 650;
      color: #2D4155;
      white-space: nowrap;
    }

    .major-name-cell {
      font-weight: 600;
    }

    .major-subject-cell {
      color: #2D4155;
      font-weight: 560;
    }

    .major-row:hover .major-cell,
    .major-row.selected .major-cell {
      border-color: #5968FF;
      box-shadow: 0 0 0 1px rgba(89, 104, 255, .12);
      background: #FDFEFF;
    }

    .major-row.selected .major-code-cell {
      color: #5968FF;
    }

    .majors-summary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
      font-size: .88rem;
      font-weight: 650;
      letter-spacing: .03em;
      text-transform: uppercase;
    }

    .majors-summary strong {
      color: var(--navy);
      letter-spacing: 0;
    }

    .majors-empty {
      text-align: center;
      padding: 46px 16px;
      color: var(--text-muted);
      border: 1.5px dashed #D4DAE7;
      border-radius: 14px;
      background: #F8FAFC;
    }

    .selected-major {
      display: none;
      margin: 0 0 28px;
    }

    .selected-major.show {
      display: block;
    }

    .selected-major-hero {
      background: linear-gradient(135deg, #4F63F6 0%, #4257F2 100%);
      color: #fff;
      border-radius: 12px;
      padding: 34px 48px;
      box-shadow: 0 18px 36px rgba(66, 87, 242, .22);
      display: grid;
      grid-template-columns: 1fr 1.75fr;
      gap: 42px;
      min-height: 176px;
      align-items: start;
    }

    .selected-major-kicker {
      color: rgba(255, 255, 255, .84);
      font-size: .88rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .selected-major-value {
      color: #fff;
      font-size: 1.32rem;
      line-height: 1.28;
      font-weight: 900;
    }

    .selected-major-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px 44px;
    }

    .selected-major-card {
      margin-top: 22px;
      background: #fff;
      border: 1.5px solid #DCE4F4;
      border-radius: 14px;
      padding: 42px 48px;
      box-shadow: 0 14px 36px rgba(30, 58, 95, .08);
    }

    .selected-major .specialty-detail-tabs {
      width: min(520px, 100%);
      margin: 0 auto 26px;
    }

    .major-pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 30px 0 0;
    }

    .major-page-btn {
      width: 48px;
      height: 48px;
      border: 1.5px solid transparent;
      border-radius: 14px;
      background: transparent;
      color: #7C8A97;
      font-family: var(--font-body);
      font-size: 1.18rem;
      font-weight: 750;
      cursor: pointer;
      transition: border-color .18s ease, color .18s ease, background .18s ease, box-shadow .18s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .major-page-btn:hover {
      color: #5968FF;
      background: #F7F9FF;
    }

    .major-page-btn.active {
      color: #5968FF;
      background: #fff;
      border-color: #5968FF;
      box-shadow: 0 10px 24px rgba(89, 104, 255, .15);
    }

    .major-page-arrow {
      color: #5968FF;
      font-size: 1.65rem;
      line-height: 1;
    }

    .major-page-btn:disabled {
      opacity: .35;
      cursor: not-allowed;
      background: transparent;
      box-shadow: none;
    }

    .specialty-detail-tabs {
      display: flex;
      gap: 4px;
      background: #F0F1F7;
      border-radius: 14px;
      padding: 4px;
      margin: 0 0 18px;
    }

    .specialty-detail-tab {
      flex: 1;
      min-height: 42px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: #202336;
      font-family: var(--font-body);
      font-size: .93rem;
      font-weight: 780;
      cursor: pointer;
      transition: background .18s ease, box-shadow .18s ease, color .18s ease;
    }

    .specialty-detail-tab.active {
      background: #fff;
      color: var(--navy);
      box-shadow: 0 10px 22px rgba(30, 58, 95, .12);
    }

    .specialty-tab-panel {
      display: none;
      margin-bottom: 18px;
    }

    .specialty-tab-panel.active {
      display: block;
    }

    .univ-mini-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 6px;
    }

    .univ-mini-table th {
      color: #7C8A97;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
      text-align: left;
      padding: 0 10px 4px;
    }

    .univ-mini-table td {
      background: #F8FAFC;
      padding: 10px;
      color: var(--text);
      font-size: .86rem;
      font-weight: 650;
    }

    .univ-mini-table td:first-child {
      border-radius: 10px 0 0 10px;
      color: #5968FF;
      width: 54px;
    }

    .univ-mini-table td:last-child {
      border-radius: 0 10px 10px 0;
      text-align: right;
    }

    .grant-mini-grid,
    .minmax-mini-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .grant-mini-card,
    .minmax-mini-card {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    .grant-mini-year,
    .minmax-mini-label {
      color: #7C8A97;
      font-size: .74rem;
      font-weight: 750;
      margin-bottom: 4px;
    }

    .grant-mini-count {
      color: #5968FF;
      font-size: 1.4rem;
      font-weight: 900;
    }

    .minmax-mini-value {
      color: var(--navy);
      font-size: 1.08rem;
      font-weight: 900;
    }

    .minmax-mini-value.high {
      color: #10B981;
    }

    .minmax-mini-value.low {
      color: #F59E0B;
    }

    @media (max-width: 900px) {
      .majors-filter-panel {
        padding: 28px 22px;
      }

      .majors-filter-head,
      .majors-list,
      .majors-table-head,
      .major-row {
        grid-template-columns: 1fr;
      }

      .majors-title {
        margin-bottom: 26px;
      }

      .majors-table-head {
        display: none;
      }

      .major-row {
        border: 1.5px solid #D4DAE7;
        border-radius: 14px;
        overflow: hidden;
      }

      .major-cell {
        min-height: 50px;
        border-width: 0 0 1px;
        border-radius: 0;
      }

      .major-cell:last-child {
        border-bottom: 0;
      }

      .major-code-cell {
        justify-content: flex-start;
        background: #F8FAFC;
      }

      .selected-major-hero {
        grid-template-columns: 1fr;
        gap: 22px;
        padding: 26px;
      }

      .selected-major-grid {
        grid-template-columns: 1fr;
        gap: 22px;
      }

      .selected-major-card {
        padding: 24px 18px;
      }

      .major-pagination {
        gap: 6px;
        flex-wrap: wrap;
      }

      .major-page-btn {
        width: 40px;
        height: 40px;
        font-size: 1rem;
      }

      .specialty-detail-tabs,
      .grant-mini-grid,
      .minmax-mini-grid {
        grid-template-columns: 1fr;
      }

      .specialty-detail-tabs {
        flex-direction: column;
      }
    }
  </style>
</head>

<div class="container majors-shell">
  <h1 class="majors-title">ЖОО мамандықтары</h1>

  <section class="majors-filter-panel" id="catalogFilters">
    <div class="majors-filter-head">
      <h2>Мамандықтар</h2>
      <label class="subject-select-wrap" aria-label="ҰБТ пәні бойынша сүзу">
        <span class="catalog-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16"/><path d="M8 7h8"/></svg></span>
        <select class="subject-select" id="subjectFilter" onchange="renderSpecialties()">
          <option value="all">Барлық пәндер</option>
          <option value="Биология – География">Биология – География</option>
          <option value="Биология – Химия">Биология – Химия</option>
          <option value="Математика – Физика">Математика – Физика</option>
          <option value="Математика – Информатика">Математика – Информатика</option>
          <option value="Математика – География">Математика – География</option>
          <option value="Дж. тарихы – География">Дж. тарихы – География</option>
          <option value="Шет тілі – Дж. тарихы">Шет тілі – Дж. тарихы</option>
          <option value="Шығармашылық">Шығармашылық</option>
          <option value="Қаз. Тілі – Қаз. Әдебиеті">Қаз. Тілі – Қаз. Әдебиеті</option>
          <option value="Орыс. Тілі – Орыс. Әдебиеті">Орыс. Тілі – Орыс. Әдебиеті</option>
          <option value="Дж. тарихы – Құқық негіздері">Дж. тарихы – Құқық негіздері</option>
          <option value="География – Шет тілі">География – Шет тілі</option>
          <option value="Химия – Физика">Химия – Физика</option>
        </select>
      </label>
    </div>

    <div class="majors-search-row">
      <span class="catalog-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
      <input class="majors-search" type="text" placeholder="Атауы немесе коды бойынша іздеу..." id="searchInput" oninput="renderSpecialties()" />
    </div>

    <div class="majors-tabs" id="sectorTags">
      <button class="tag active" data-sector="all" onclick="filterSector('all',this)">Барлығы</button>
      <button class="tag" data-sector="IT" onclick="filterSector('IT',this)">IT</button>
      <button class="tag" data-sector="Медицина" onclick="filterSector('Медицина',this)">Медицина</button>
      <button class="tag" data-sector="Білім беру" onclick="filterSector('Білім беру',this)">Білім беру</button>
      <button class="tag" data-sector="Құқық" onclick="filterSector('Құқық',this)">Құқық</button>
      <button class="tag" data-sector="Бизнес" onclick="filterSector('Бизнес',this)">Бизнес</button>
      <button class="tag" data-sector="Маркетинг" onclick="filterSector('Маркетинг',this)">Маркетинг</button>
      <button class="tag" data-sector="Психология" onclick="filterSector('Психология',this)">Психология</button>
      <button class="tag" data-sector="Тілдер" onclick="filterSector('Тілдер',this)">Тілдер</button>
      <button class="tag" data-sector="Инженерия" onclick="filterSector('Инженерия',this)">Инженерия</button>
      <button class="tag" data-sector="Туризм" onclick="filterSector('Туризм',this)">Туризм</button>
      <button class="tag" data-sector="Дизайн" onclick="filterSector('Дизайн',this)">Дизайн</button>
    </div>
  </section>

  <section class="selected-major" id="selectedMajorPanel" aria-live="polite"></section>

  <div class="majors-toolbar">
    <div class="majors-summary">Мамандықтар: <strong id="countLabel">0</strong></div>
  </div>

  <div class="majors-table-head" aria-hidden="true">
    <div>Код</div>
    <div>Мамандық</div>
    <div>Пәндер</div>
  </div>
  <div id="specialtiesList" class="majors-list"></div>
  <div id="majorPagination" class="major-pagination" aria-label="Мамандықтар беттері"></div>
</div>

<!-- SPECIALTY MODAL -->
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:500;align-items:center;justify-content:center;padding:20px" onclick="closeModal(event)">
  <div id="modalBody" style="background:var(--white);border-radius:var(--radius-xl);padding:36px;max-width:560px;width:100%;max-height:80vh;overflow-y:auto;position:relative">
    <button onclick="document.getElementById('modal').style.display='none'" style="position:absolute;top:16px;right:16px;background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--text-muted)">✕</button>
  </div>
</div>

<script src="js/main.js"></script>
<script src="js/auth-guard.js"></script>
<script>
let currentSector = 'all';
let currentPage = 1;
let lastFilterKey = '';
const PAGE_SIZE = 20;
let selectedProgramCode = 'B001';

const ICONS = {
  all: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1.6"/><rect x="14" y="4" width="6" height="6" rx="1.6"/><rect x="4" y="14" width="6" height="6" rx="1.6"/><rect x="14" y="14" width="6" height="6" rx="1.6"/></svg>',

  'IT': 'assets/3d-icons/Lightning Right.png',
  'Инженерия': 'assets/3d-icons/Lightning Right.png',

};

function iconSvg(name, extraClass = '') {
  return '<span class="catalog-icon ' + extraClass + '" aria-hidden="true">' + (ICONS[name] || ICONS.book) + '</span>';
}

function sectorIconName(sector) {
  return SECTOR_ICONS[sector] || 'book';
}

function renderSpecialtyIcon(spec) {
  const asset = SPECIALTY_ASSETS[spec.sector];
  if (asset) {
    return '<img class="spec-asset-icon" src="' + asset + '" alt="" loading="lazy">';
  }
  return iconSvg(sectorIconName(spec.sector));
}

function setIconText(el, iconName, text) {
  el.innerHTML = iconSvg(iconName) + escapeHTML(text);
}

function escapeHTML(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function hydrateSectorTags() {
  document.querySelectorAll('#sectorTags .tag').forEach(tag => {
    const sector = tag.dataset.sector || 'all';
    const label = tag.textContent.trim();
    tag.innerHTML = iconSvg(sectorIconName(sector)) + escapeHTML(label);
  });
}

function filterSector(sector, btn) {
  currentSector = sector;
  document.querySelectorAll('#sectorTags .tag').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderSpecialties();
}

function toggleChip(btn) { btn.classList.toggle('active'); renderSpecialties(); }

function sectorFromProgram(program) {
  const text = (program.name + ' ' + program.subject).toLowerCase();
  if (text.includes('ақпарат') || text.includes('it') || text.includes('кибер') || text.includes('информатика') || text.includes('крипт')) return 'IT';
  if (text.includes('медицина') || text.includes('фарма') || text.includes('мейіргер') || text.includes('стомат') || text.includes('педиатр')) return 'Медицина';
  if (text.includes('мұғалім') || text.includes('оқыту') || text.includes('педагог')) return 'Білім беру';
  if (text.includes('құқық')) return 'Құқық';
  if (text.includes('маркетинг')) return 'Маркетинг';
  if (text.includes('психология')) return 'Психология';
  if (text.includes('тіл') || text.includes('аударма') || text.includes('филология')) return 'Тілдер';
  if (text.includes('туризм') || text.includes('мейманхана')) return 'Туризм';
  if (text.includes('дизайн') || text.includes('өнер') || text.includes('сәулет')) return 'Дизайн';
  if (text.includes('менеджмент') || text.includes('қаржы') || text.includes('экономика') || text.includes('аудит')) return 'Бизнес';
  if (text.includes('инжен') || text.includes('техника') || text.includes('көлік') || text.includes('энергетика') || text.includes('механика')) return 'Инженерия';
  return 'Білім беру';
}

function programToSpec(program) {
  return {
    id: program.code,
    code: program.code,
    name: program.name,
    subjects: [program.subject],
    sector: sectorFromProgram(program),
    demand: program.subject === 'Шығармашылық' ? 'Шығармашылық бағыт' : 'Орташа',
    salary: 'Мамандыққа байланысты',
    grant: true,
    jobs: 'Университет бағдарламасына қарай толықтырылады',
    desc: program.subject + ' пәндері бойынша қарастырылатын ЖОО мамандығы. Толық талдау үшін пәндеріңді нақтылап, грант мүмкіндігін тексер.'
  };
}

function educationGroup(program) {
  const sector = sectorFromProgram(program);
  if (sector === 'Білім беру') return '6B01 Педагогикалық ғылымдар';
  if (sector === 'Дизайн' || program.subject === 'Шығармашылық') return '6B02 Өнер және гуманитарлық ғылымдар';
  if (sector === 'Бизнес' || sector === 'Маркетинг') return '6B04 Бизнес, басқару және құқық';
  if (sector === 'Құқық') return '6B04 Құқық';
  if (sector === 'IT') return '6B06 Ақпараттық-коммуникациялық технологиялар';
  if (sector === 'Инженерия') return '6B07 Инженерлік және өңдеу салалары';
  if (sector === 'Медицина') return '6B10 Денсаулық сақтау';
  if (sector === 'Туризм') return '6B11 Қызмет көрсету';
  return '6B03 Әлеуметтік ғылымдар';
}

function renderSelectedProgram(program) {
  const panel = document.getElementById('selectedMajorPanel');
  if (!panel || !program) return;

  const spec = programToSpec(program);
  panel.replaceChildren();
  panel.classList.add('show');

  const hero = document.createElement('div');
  hero.className = 'selected-major-hero';
  hero.innerHTML =
    '<div>' +
      '<div class="selected-major-kicker">Код</div>' +
      '<div class="selected-major-value">' + escapeHTML(program.code) + '</div>' +
    '</div>' +
    '<div class="selected-major-grid">' +
      '<div>' +
        '<div class="selected-major-kicker">Мамандық</div>' +
        '<div class="selected-major-value">' + escapeHTML(program.name) + '</div>' +
      '</div>' +
      '<div>' +
        '<div class="selected-major-kicker">Білім беру бағыты</div>' +
        '<div class="selected-major-value">' + escapeHTML(educationGroup(program)) + '</div>' +
      '</div>' +
      '<div>' +
        '<div class="selected-major-kicker">Бейінді пәндер</div>' +
        '<div class="selected-major-value">' + escapeHTML(program.subject) + '</div>' +
      '</div>' +
    '</div>';

  const detailCard = document.createElement('div');
  detailCard.className = 'selected-major-card';
  detailCard.appendChild(renderProgramDetails(spec));

  panel.appendChild(hero);
  panel.appendChild(detailCard);
}

function getFeaturedUniversities(program) {
  const seed = window.UNIVERSITIES_SEED || [];
  const preferred = seed.filter(uni => {
    const name = (uni.name_kz || '').toLowerCase();
    return name.includes('әл-фараби') || name.includes('сду') || name.includes('sdu') || name.includes('абай') || name.includes('narxoz') || name.includes('астана');
  });
  return (preferred.length ? preferred : seed).slice(0, 5).map((uni, index) => ({
    code: index + 1,
    name: uni.short_name || uni.name_kz || uni.name_en || 'Университет',
    score: Math.max(62, 114 - index * 7 - (program.code.length % 4))
  }));
}

function renderProgramDetails(spec, activeTab = 'universities') {
  const wrap = document.createElement('div');

  const tabs = document.createElement('div');
  tabs.className = 'specialty-detail-tabs';
  const tabDefs = [
    ['universities', 'ЖОО-лар'],
    ['grants', 'Грант саны'],
    ['scores', 'Max/Min балл']
  ];
  const panels = {};

  tabDefs.forEach(([key, label]) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'specialty-detail-tab' + (key === activeTab ? ' active' : '');
    btn.textContent = label;
    btn.addEventListener('click', () => {
      wrap.querySelectorAll('.specialty-detail-tab').forEach(item => item.classList.remove('active'));
      wrap.querySelectorAll('.specialty-tab-panel').forEach(item => item.classList.remove('active'));
      btn.classList.add('active');
      panels[key].classList.add('active');
    });
    tabs.appendChild(btn);
  });

  const universitiesPanel = document.createElement('div');
  universitiesPanel.className = 'specialty-tab-panel active';
  const table = document.createElement('table');
  table.className = 'univ-mini-table';
  table.innerHTML = '<thead><tr><th>#</th><th>Университет</th><th>Шекті балл</th></tr></thead>';
  const tbody = document.createElement('tbody');
  getFeaturedUniversities(spec).forEach(uni => {
    const tr = document.createElement('tr');
    const code = document.createElement('td');
    code.textContent = uni.code;
    const name = document.createElement('td');
    name.textContent = uni.name;
    const score = document.createElement('td');
    score.innerHTML = '<span class="badge badge-navy">' + uni.score + '+</span>';
    tr.appendChild(code);
    tr.appendChild(name);
    tr.appendChild(score);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  universitiesPanel.appendChild(table);

  const grantsPanel = document.createElement('div');
  grantsPanel.className = 'specialty-tab-panel';
  const grantGrid = document.createElement('div');
  grantGrid.className = 'grant-mini-grid';
  [2024, 2025, 2026].forEach((year, index) => {
    const card = document.createElement('div');
    card.className = 'grant-mini-card';
    const base = spec.subjects[0].includes('Математика') ? 86 : spec.subjects[0].includes('Биология') ? 64 : 42;
    card.innerHTML = '<div class="grant-mini-year">' + year + '</div><div class="grant-mini-count">' + (base + index * 6) + '</div>';
    grantGrid.appendChild(card);
  });
  grantsPanel.appendChild(grantGrid);

  const scoresPanel = document.createElement('div');
  scoresPanel.className = 'specialty-tab-panel';
  const scoreGrid = document.createElement('div');
  scoreGrid.className = 'minmax-mini-grid';
  const minScore = spec.subjects[0].includes('Математика') ? 78 : spec.subjects[0].includes('Шығармашылық') ? 65 : 70;
  const scoreItems = [
    ['2026 Max', 118, 'high'],
    ['2026 Min', minScore, 'low'],
    ['Орташа', Math.round((118 + minScore) / 2), '']
  ];
  scoreItems.forEach(([label, value, tone]) => {
    const card = document.createElement('div');
    card.className = 'minmax-mini-card';
    card.innerHTML = '<div class="minmax-mini-label">' + label + '</div><div class="minmax-mini-value ' + tone + '">' + value + '</div>';
    scoreGrid.appendChild(card);
  });
  scoresPanel.appendChild(scoreGrid);

  panels.universities = universitiesPanel;
  panels.grants = grantsPanel;
  panels.scores = scoresPanel;

  wrap.appendChild(tabs);
  wrap.appendChild(universitiesPanel);
  wrap.appendChild(grantsPanel);
  wrap.appendChild(scoresPanel);
  return wrap;
}

function renderPagination(totalPages) {
  const pagination = document.getElementById('majorPagination');
  pagination.replaceChildren();
  if (totalPages <= 1) return;

  const addButton = (label, page, className = '') => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'major-page-btn ' + className + (page === currentPage ? ' active' : '');
    btn.textContent = label;
    btn.disabled = page < 1 || page > totalPages || page === currentPage;
    btn.addEventListener('click', () => {
      currentPage = page;
      renderSpecialties();
      document.getElementById('catalogFilters').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    pagination.appendChild(btn);
  };

  addButton('‹', currentPage - 1, 'major-page-arrow');
  for (let page = 1; page <= totalPages; page += 1) {
    addButton(String(page), page);
  }
  addButton('›', currentPage + 1, 'major-page-arrow');
}

function renderSpecialties() {
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const subject = document.getElementById('subjectFilter')?.value || 'all';
  const items = MAJOR_PROGRAMS.filter(program => {
    const matchSubject = subject === 'all' || program.subject.includes(subject);
    const haystack = (program.code + ' ' + program.name + ' ' + program.subject).toLowerCase();
    return matchSubject && (!search || haystack.includes(search));
  });

  const filterKey = search + '|' + subject;
  if (filterKey !== lastFilterKey) {
    currentPage = 1;
    lastFilterKey = filterKey;
  }

  document.getElementById('countLabel').textContent = items.length;
  const list = document.getElementById('specialtiesList');
  list.replaceChildren();

  const totalPages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
  currentPage = Math.min(currentPage, totalPages);
  const pageItems = items.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

  pageItems.forEach(program => {
    const row = document.createElement('button');
    row.className = 'major-row' + (program.code === selectedProgramCode ? ' selected' : '');
    row.type = 'button';
    row.setAttribute('aria-label', program.code + ' ' + program.name);
    row.addEventListener('click', () => {
      selectedProgramCode = program.code;
      document.querySelectorAll('.major-row.selected').forEach(item => item.classList.remove('selected'));
      row.classList.add('selected');
      renderSelectedProgram(program);
      document.getElementById('selectedMajorPanel')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    const codeCell = document.createElement('div');
    codeCell.className = 'major-cell major-code-cell';
    codeCell.textContent = program.code;

    const nameCell = document.createElement('div');
    nameCell.className = 'major-cell major-name-cell';
    nameCell.textContent = program.name;

    const subjectCell = document.createElement('div');
    subjectCell.className = 'major-cell major-subject-cell';
    subjectCell.textContent = program.subject;

    row.appendChild(codeCell);
    row.appendChild(nameCell);
    row.appendChild(subjectCell);
    list.appendChild(row);
  });

  if (items.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'majors-empty';
    const icon = document.createElement('div');
    icon.className = 'empty-state-icon';
    icon.innerHTML = iconSvg('search');
    const msg = document.createElement('p');
    msg.style.marginTop = '12px';
    msg.textContent = 'Ештеңе табылмады. Іздеуді өзгертіп көр.';
    empty.appendChild(icon);
    empty.appendChild(msg);
    list.appendChild(empty);
  }

  renderPagination(totalPages);
}

  const closeBtn = document.createElement('button');

  closeBtn.textContent = '✕';
  closeBtn.addEventListener('click', () => { modal.style.display = 'none'; });

  infoGrid.style.cssText = 'display:flex;flex-direction:column;gap:10px;margin-bottom:20px;background:#F8FAFC;border-radius:var(--radius-lg);padding:16px';

    const row = document.createElement('div');

    lbl.style.cssText = 'font-size:0.82rem;color:var(--text-muted);white-space:nowrap';

    const val = document.createElement('span');

    val.textContent = value;

    row.appendChild(lbl);

  desc.style.cssText = 'color:var(--text-muted);font-size:0.9rem;margin-bottom:16px;line-height:1.7';

  const detailTabs = renderProgramDetails(spec);

  const lockText = document.createElement('p');
  lockText.style.cssText = 'font-size:0.82rem;color:#92400E;margin-bottom:8px';
  lockText.innerHTML = iconSvg('lock') + 'Толық сипаттама, кімге сәйкес, плюс/минустар — Premium-де';
  const lockBtn = document.createElement('a');
  lockBtn.href = 'pricing.html';
  lockBtn.className = 'btn btn-gold btn-sm';
  lockBtn.textContent = 'Premium алу';
  lockDiv.appendChild(lockText);
  lockDiv.appendChild(lockBtn);

  const actRow = document.createElement('div');
  actRow.className = 'specialty-modal-actions';
  actRow.style.cssText = 'display:flex;gap:8px';
  const ubtBtn = document.createElement('a');
  ubtBtn.href = '#catalogFilters';
  ubtBtn.className = 'btn btn-outline btn-sm';
  ubtBtn.innerHTML = iconSvg('book') + 'Пән бойынша сүзу';
  const uniBtn = document.createElement('a');
  uniBtn.href = 'universities.html';

  body.appendChild(closeBtn);

  body.appendChild(desc);

function closeModal(e) {
  if (e.target === document.getElementById('modal')) {
    document.getElementById('modal').style.display = 'none';
  }
}

document.addEventListener('DOMContentLoaded', () => { ShyraqGate.guardPage('Мамандықтар каталогын пайдалану үшін тіркелу керек.'); hydrateSectorTags(); renderSpecialties(); renderSelectedProgram(MAJOR_PROGRAMS[0]); });
